<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <rect width="1200" height="400" rx="12" fill="#0f172a"/>
  <!-- Document/Rules icon -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="240" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Document lines (rules) -->
    <rect x="20" y="24" width="160" height="8" rx="4" fill="#38bdf8" opacity="0.15"/>
    <rect x="20" y="24" width="200" height="8" rx="4" fill="#38bdf8"/>
    <!-- Checkmark -->
    <rect x="200" y="24" width="20" height="8" rx="4" fill="#38bdf8"/>
    <!-- Rule rows -->
    <rect x="20" y="52" width="180" height="6" rx="3" fill="#475569"/>
    <rect x="36" y="72" width="200" height="12" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="100" width="140" height="6" rx="3" fill="#475569"/>
    <rect x="36" y="120" width="200" height="12" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="148" width="160" height="6" rx="3" fill="#475569"/>
    <rect x="36" y="168" width="200" height="12" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="196" width="100" height="6" rx="3" fill="#475569"/>
  </g>
  <!-- Text -->
  <text x="380" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-1">CRITIQ</text>
  <text x="380" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8" letter-spacing="0.5">Open Source Rules</text>
</svg>
