name: Critiq PR

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  critiq:
    uses: critiq-dev/critiq-action/.github/workflows/reusable-critiq.yml@main
    secrets: inherit
    with:
      checkout-layout: rules-with-sibling-core
      working-directory: critiq-rules
      fail-on-severity: off
