name: Critiq PR

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  critiq:
    runs-on: ubuntu-latest
    env:
      CRITIQ_CORE_ROOT: ${{ github.workspace }}/critiq-core
      CRITIQ_RULES_ROOT: ${{ github.workspace }}/critiq-rules
      CRITIQ_SKIP_CORE_BUILD: '1'
    steps:
      - name: Checkout critiq-rules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: critiq-rules

      - name: Checkout critiq-core
        uses: actions/checkout@v6
        with:
          repository: critiq-dev/critiq-core
          path: critiq-core

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            critiq-core/package-lock.json
            critiq-rules/package-lock.json

      - name: Install critiq-core
        working-directory: critiq-core
        run: npm ci

      - name: Build critiq-core artifacts
        working-directory: critiq-core
        run: |
          npm run build
          npm run build:release-cli

      - name: Run Critiq
        uses: critiq-dev/critiq-action@v1
        with:
          node-version: '24'
          working-directory: critiq-rules
          fail-on-severity: off
