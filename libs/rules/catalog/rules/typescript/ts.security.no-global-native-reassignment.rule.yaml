apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.no-global-native-reassignment
  version: v1
  title: Do not reassign global native bindings
  summary: Do not reassign global native bindings such as `Object`, `Array`, or `undefined`.
  rationale: Reassigning global natives breaks language invariants, can disable security checks that rely on them, and may facilitate prototype pollution or sandbox escape attacks.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-94
      title: Improper Control of Generation of Code
    - kind: owasp
      title: Code Injection
      url: https://owasp.org/www-community/attacks/Code_Injection
  tags:
    - security
    - language
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      - "**/test/**"
      - "**/tests/**"
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/e2e/**"
      - "**/polyfill*/**"
      - "**/shim*/**"
      - "**/zone.js/**"
match:
  fact:
    kind: security.global-native-reassignment
    bind: issue
emit:
  finding:
    category: security.language
    severity: high
    confidence: 0.97
    tags:
      - security
      - language
  message:
    title: Do not reassign global native bindings
    summary: "`${captures.issue.text}` reassigns a global native binding. This can break runtime guarantees, disable security checks, and create sandbox escape opportunities. Polyfills, shims, test mocks, and Zone.js are excluded via path patterns."

  remediation:
    summary: Use local variables with distinct names instead of overwriting global natives. Polyfills and shims can be placed in `**/polyfill*/**` or `**/shim*/**` directories to be automatically excluded.
