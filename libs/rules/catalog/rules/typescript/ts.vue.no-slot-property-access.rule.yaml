apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.vue.no-slot-property-access
  version: v1
  title: Call $slots entries as functions
  summary: "In Vue 3, $slots entries are functions. Access them by calling `$slots.slotName()`, not by treating them as values."
  rationale: Vue 3 changed `$slots` to return functions for scoped slot content. Accessing `this.$slots.default[0]` or using `this.$slots.default` as a value without calling it will not work as expected. Always invoke slot functions to render content.
  aliases:
    - JS-0658
  tags:
    - vue
    - correctness
    - rules-catalog
  stability: experimental
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: framework.vue.slots-property-access
    bind: issue
emit:
  finding:
    category: correctness.ui
    severity: high
    confidence: 0.85
    tags:
      - vue
      - correctness
  message:
    title: Call $slots entry as a function
    summary: "${captures.issue.text} accesses a $slots entry without calling it. Use `$slots.slotName()` to render slot content."
  remediation:
    summary: "Replace `this.$slots.slotName` with `this.$slots.slotName()`. In Vue 3, slot entries are render functions and must be called to produce virtual nodes."
