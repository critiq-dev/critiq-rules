apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.constructor-return-value
  version: v2
  title: Return value in constructor
  summary: A `return` with a value inside a class constructor overrides the newly created instance when the value is an object and is silently discarded for primitives, usually signaling a bug.
  rationale: >-
    A `return` statement carrying a value inside a class constructor is either
    silently ignored (for primitive values) or replaces the freshly constructed
    instance entirely (for object values), overriding `this`. Both outcomes are
    surprising and typically indicate a mistake, such as logic copied from a
    factory function or a misplaced early return. Constructors should initialize
    `this` and let the runtime return the instance.
  aliases:
    - JS-0109
  tags:
    - correctness
    - language
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  # The language.constructor-return-value fact is emitted only for return
  # statements in the constructor's own function scope; returns inside nested
  # callbacks or arrow functions passed to super()/this._register(...) are not
  # matched (see critiq-core typescript adapter walkFunctionScope).
  fact:
    kind: language.constructor-return-value
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: medium
    confidence: 0.85
    tags:
      - correctness
      - language
  message:
    title: Return value in constructor
    summary: "Returning `${captures.issue.text}` from a constructor overrides the newly created instance for object values and is discarded for primitives; this is almost always unintentional."
  remediation:
    summary: Remove the `return` statement and assign to `this` instead, or move object-producing logic into a static factory method.
