apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.observable-timing-discrepancy
  version: v1
  title: Use constant-time secret comparison
  summary: Secrets and tokens should not be compared with ordinary equality operators.
  rationale: "Ordinary string comparison can leak timing differences that help attackers guess secret material. This heuristic is deliberately narrow: only variables whose names contain strongly secret-indicating terms (password, secret, hash, passphrase, apiKey, authToken) are considered. Comparisons involving roles, emails, sessions, groups, scopes, feature flags, and other metadata are excluded because they do not involve secret material."
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-327
      title: Use of a Broken or Risky Cryptographic Algorithm
    - kind: owasp
      title: Cryptographic Storage Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
  tags:
    - security
    - cryptography
    - timing
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: security.observable-timing-discrepancy
    bind: issue
emit:
  finding:
    category: security.cryptography
    severity: low
    confidence: 0.30
    tags:
      - security
      - cryptography
      - timing
  message:
    title: Use a constant-time comparison for secret or token comparison
    summary: "`${captures.issue.text}` compares a value that may be a secret or token using ordinary equality (`===`/`!==`), which can leak timing information that helps attackers guess cryptographic material."
  remediation:
    summary: Use a constant-time comparison helper such as `crypto.timingSafeEqual` for secrets, tokens, and password hashes. Ordinary equality should only be used for non-sensitive comparisons (type checks, input validation, enum matching).


