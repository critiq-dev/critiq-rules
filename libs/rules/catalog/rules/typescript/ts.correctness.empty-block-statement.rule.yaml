apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.empty-block-statement
  version: v2
  title: Empty block statement
  summary: A control-flow or try/catch branch uses an empty `{}` block with no explanatory comment.
  rationale: Empty blocks without a comment hide missing logic, swallowed errors, or incomplete refactors. An explanatory comment signals intent and distinguishes deliberate no-ops from accidental omissions. Empty function bodies such as `() => {}` are excluded since they are common stub patterns.
  aliases:
    - JS-0009
  tags:
    - correctness
    - language
    - rules-catalog
    - crq-cor-025
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: language.empty-block-statement
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: low
    confidence: 0.85
    tags:
      - correctness
      - language
  message:
    title: Replace or remove empty block
    summary: "This block has no statements and no explanatory comment. Add the intended behavior, a comment such as '// no-op: intentionally empty', or delete the branch."
  remediation:
    summary: "Add the intended statements, insert a comment like \"// Intentionally empty: ...\" to signal intent, throw or log in error paths, or remove the branch if it is dead code."
