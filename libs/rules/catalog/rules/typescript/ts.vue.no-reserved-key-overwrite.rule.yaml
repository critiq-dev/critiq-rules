apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.vue.no-reserved-key-overwrite
  title: Avoid overwriting reserved keys
  summary: Vue instance reserved keys ($el, $data, $props, etc.) should not be overwritten to prevent framework contract violations.
  rationale: Overwriting Vue-reserved properties such as $el, $data, $route, or $refs can break component lifecycle, reactivity, and routing. These keys are used internally by Vue and should be treated as read-only.
  aliases:
    - JS-0613
  tags:
    - vue
    - correctness
    - rules-catalog
  stability: experimental
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: framework.vue.reserved-key-overwrite
    bind: issue
emit:
  finding:
    category: correctness.ui
    severity: medium
    confidence: 0.85
    tags:
      - vue
      - correctness
  message:
    title: Avoid overwriting Vue reserved key
    summary: "${captures.issue.text} overwrites a Vue instance reserved key."
  remediation:
    summary: Replace the assignment with a different property name that does not conflict with Vue's internal API. Use a custom data property instead.
