apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.no-dynamic-execution
  version: v1
  title: Eval or dynamic code execution
  summary: Eval-like helpers, `vm` execution APIs, and string-evaluated timers should not execute dynamic code.
  rationale: Dynamic execution turns data into code and widens the attack surface. Without taint tracking, this rule fires on legitimate library and template code patterns where the input is fully controlled.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-94
      title: Improper Control of Generation of Code
    - kind: owasp
      title: Code Injection
      url: https://owasp.org/www-community/attacks/Code_Injection
  tags:
    - security
    - execution
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      - "**/test/**"
      - "**/tests/**"
      - "**/__tests__/**"
      - "**/harness/**"
      - "**/*.test.*"
      - "**/*.spec.*"
match:
  fact:
    kind: security.dynamic-execution
    bind: issue
emit:
  finding:
    category: security.execution
    severity: high
    confidence: 0.7
    tags:
      - security
      - execution
  message:
    title: Avoid dynamic code execution via `${captures.issue.text}`
    summary: >
      `${captures.issue.text}` executes arbitrary code at runtime,
      widening the attack surface for code injection (CWE-94).
      Test infrastructure and harness files are excluded — this
      finding applies only to production code.
  remediation:
    summary: >
      Replace dynamic execution with a safer alternative:
      explicit parsing, fixed dispatch tables, or normal
      function callbacks. For test infrastructure, silence
      this finding with an inline suppression comment.
