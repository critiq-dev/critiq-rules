apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.no-dynamic-execution
  title: Eval or dynamic code execution
  summary: Eval-like helpers, `vm` execution APIs, and string-evaluated timers should not execute dynamic code.
  rationale: Dynamic execution turns data into code and widens the attack surface. Without taint tracking, this rule fires on legitimate library and template code patterns where the input is fully controlled.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-94
      title: Improper Control of Generation of Code
    - kind: owasp
      title: Code Injection
      url: https://owasp.org/www-community/attacks/Code_Injection
  tags:
    - security
    - execution
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: security.dynamic-execution
    bind: issue
emit:
  finding:
    category: security.execution
    severity: low
    confidence: 0.55
    tags:
      - security
      - execution
  message:
    title: Avoid `${captures.issue.text}`
    summary: "`${captures.issue.text}` executes dynamic code and should be replaced with a safer alternative."
  remediation:
    summary: Replace dynamic execution with explicit parsing, fixed dispatch tables, or normal function callbacks.

