apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.unsanitized-http-response
  version: v2
  title: Avoid raw response output driven by request input
  summary: Raw response sinks should not echo request data without escaping or sanitization. JSON.stringify and JSON responses are excluded — their output is not executable markup.
  rationale: Directly reflecting request data into HTML-capable response sinks creates reflected XSS and content injection risk.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-79
      title: Cross-site Scripting (XSS)
    - kind: owasp
      title: Cross Site Scripting Prevention Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
  tags:
    - security
    - xss
    - express
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/__tests__/**"
      - "**/test/**"
      - "**/tests/**"
      - "**/*.d.ts"
      - "**/__generated__/**"
      - "**/__fixtures__/**"
      - "**/*.example.*"
match:
  fact:
    kind: security.unsanitized-http-response
    bind: issue
emit:
  finding:
    category: security.output-encoding
    severity: medium
    confidence: 0.88
    tags:
      - security
      - xss
      - express
  message:
    title: Remove request data from `${captures.issue.text}` or escape it first
    summary: "`${captures.issue.text}` writes request-controlled data into a raw HTTP response sink without a trusted HTML escaping model."
  remediation:
    summary: Escape or sanitize the data with a trusted helper, or switch to a response format that does not treat it as executable markup.

