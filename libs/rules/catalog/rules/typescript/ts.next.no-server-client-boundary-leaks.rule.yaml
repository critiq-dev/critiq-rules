apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.next.no-server-client-boundary-leaks
  title: Avoid server/client boundary leaks in Next.js
  summary: Server components should not use browser-only APIs or client-only hooks without an explicit client boundary.
  rationale: Browser globals and client-only hooks break server rendering boundaries and make component intent unclear.
  tags:
    - next
    - react
    - rules-catalog
  stability: experimental
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      - "**/assets/javascripts/**"
      - "**/assets/**"
      - "**/vendor/**"
match:
  fact:
    kind: framework.next-server-client-boundary-leak
    bind: issue
emit:
  finding:
    category: correctness.framework
    severity: medium
    confidence: 0.8
    tags:
      - next
      - react
      - correctness
  message:
    title: Add a client boundary before using browser-only APIs in Next.js server files
    summary: After "`${captures.issue.text}`" is a browser-only API or Next.js client hook used outside a `'use client'` boundary in a Next.js component."
  remediation:
    summary: Add `'use client'` at the top of the file, or extract the browser-specific code into a separate client component or hook. In Next.js, server components cannot use browser APIs like `window`, `document`, or client hooks like `usePathname()`.

