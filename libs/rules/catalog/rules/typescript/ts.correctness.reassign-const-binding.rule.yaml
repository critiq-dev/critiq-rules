apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.reassign-const-binding
  version: v1
  title: Reassigning const binding
  summary: Detects reassigning const binding issues in JavaScript and TypeScript source.
  rationale: Reassigning const binding patterns are a common source of bugs and confusing runtime behavior.
  aliases:
    - JS-0230
  tags:
    - correctness
    - language
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: language.reassign-const-binding
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: medium
    confidence: 0.85
    tags:
      - correctness
      - language
  message:
    title: Fix reassigning const binding
    summary: "`${captures.issue.text}` matches ts.correctness.reassign-const-binding."
  remediation:
    summary: Refactor the code to remove the reassigning const binding pattern.
