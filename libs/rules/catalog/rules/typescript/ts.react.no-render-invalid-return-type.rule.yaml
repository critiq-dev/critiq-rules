apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.react.no-render-invalid-return-type
  version: v2
  title: Render must return valid React element
  summary: A class component render method returns a value that React cannot render as a child, such as a plain object, causing a runtime error or blank UI.
  rationale: |
    React class component render methods must return a valid React node. Acceptable return values include JSX elements, fragments, strings, numbers, booleans, null, arrays of valid nodes, and template literals. Returning a plain object, function, symbol, or undefined (via bare return) causes React to throw "Objects are not valid as a React child." Other non-renderable values silently produce empty output. The check also follows logical operators (&&, ||) and ternary expressions.
  aliases:
    - JS-0467
  tags:
    - react
    - ui
    - rules-catalog
  stability: experimental
  appliesTo: function
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: ui.react.render-return-value
    bind: issue
emit:
  finding:
    category: correctness.ui
    severity: high
    confidence: 0.88
    tags:
      - react
      - ui
  message:
    title: Return a valid React element from render
    summary: "render returns `${captures.issue.text}` which is not a valid React child."
  remediation:
    summary: Wrap the return value in a JSX element, fragment, or string. Use null to render nothing.
