apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.unnecessary-return-await
  version: v1
  title: Unnecessary Return Await
  summary: Remove redundant return await that adds microtask overhead without behavioral change.
  rationale: |
    In async functions outside of try/catch blocks, `return await expr` and `return expr`
    behave identically — both return the promise unchanged. The `await` introduces an extra
    microtask tick and stack frame with no benefit. Removing it improves performance
    and reduces stack depth. When the return is inside try/catch, the await is necessary
    to ensure rejections are caught.
  aliases:
    - JS-0111
  tags:
    - performance
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: async.unnecessary-return-await
    bind: issue
emit:
  finding:
    category: performance
    severity: low
    confidence: 0.95
    tags:
      - performance
  message:
    title: Unnecessary Return Await
    summary: "`${captures.issue.text}` uses `return await` outside try/catch which is unnecessary — remove the `await`."
  remediation:
    summary: Replace `return await expr` with `return expr` when not inside a try/catch block. The await is necessary inside try/catch to catch rejections.
