apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.unused-variable
  version: v1
  title: Unused variable
  summary: Detects unused variable issues in JavaScript and TypeScript source.
  rationale: Unused variables represent dead code and cleanup opportunities; they rarely indicate correctness bugs. Exported variables are not flagged as unused since they exit the module boundary.
  aliases:
    - JS-0128
  tags:
    - maintainability
    - language
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: language.unused-variable
    bind: issue
emit:
  finding:
    category: maintainability.language
    severity: low
    confidence: 0.75
    tags:
      - maintainability
      - language
  message:
    title: Fix unused variable
    summary: "`${captures.issue.text}` is declared but never used. Remove unused declarations to eliminate dead code."
  remediation:
    summary: Remove the unused variable declaration. If the variable is intended for use in other modules, export it instead.
