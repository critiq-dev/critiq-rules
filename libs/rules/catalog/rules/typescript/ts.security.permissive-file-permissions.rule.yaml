apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.permissive-file-permissions
  version: v2
  title: Avoid world-writable file modes
  summary: World-writable file modes let any local user or process modify files, risking unauthorized data tampering or privilege escalation.
  rationale: Granting write permission to "other" (modes containing 0o002) lets any local user or process alter the file. This is always dangerous — unlike world-readable modes such as 0o644 or 0o755, which are standard for public resources like TLS certificates, configuration files, and directories.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-732
      title: Incorrect Permission Assignment for Critical Resource
    - kind: owasp
      title: File Permission
      url: https://owasp.org/www-community/vulnerabilities/Improper_File_Permissions
  tags:
    - security
    - filesystem
    - permissions
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: security.permissive-file-permissions
    bind: issue
emit:
  finding:
    category: security.filesystem
    severity: high
    confidence: 0.95
    tags:
      - security
      - filesystem
      - permissions
  message:
    title: Tighten the mode used by `${captures.issue.text}`
    summary: "`${captures.issue.text}` sets a world-writable file mode."
  remediation:
    summary: Use the minimum required file mode and remove world-readable or world-writable bits.


