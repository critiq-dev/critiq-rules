apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.restricted-object-property
  title: Restricted object property access
  summary: Detects restricted object property access issues in JavaScript and TypeScript source.
  rationale: Restricted object property access patterns are a common source of bugs and confusing runtime behavior.
  aliases:
    - JS-0110
  tags:
    - correctness
    - language
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: language.restricted-object-property
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: high
    confidence: 0.85
    tags:
      - correctness
      - language
  message:
    title: Fix restricted object property access
    summary: "`${captures.issue.text}` matches ts.correctness.restricted-object-property."
  remediation:
    summary: Refactor the code to remove the restricted object property access pattern.
