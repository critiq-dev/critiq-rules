apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.information-leakage
  version: v2
  title: Avoid leaking sensitive or diagnostic state
  summary: Logs, stdout or stderr, and direct response sinks should not expose sensitive fields or internal diagnostic detail.
  rationale: Stack traces, request metadata, auth or session objects, and environment state are often leaked through "temporary" debugging output that later reaches production paths.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-532
      title: Insertion of Sensitive Information into Log File
    - kind: owasp
      title: Logging Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
  tags:
    - security
    - privacy
    - logging
    - diagnostics
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      # Test files and directories — diagnostic logging is expected here
      - "**/test/**"
      - "**/tests/**"
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      # E2E and integration test directories
      - "**/e2e/**"
      - "**/e2e-tests/**"
      # Storybook and demo files
      - "**/*.stories.*"
      # Test fixtures and harnesses
      - "**/fixtures/**"
      # Database seed scripts — one-off utilities where console logging is expected
      - "**/seed/**"
      - "**/seed*/**"
      - "**/*.seed.*"
      # Build and utility scripts
      - "**/scripts/**"
      # Example and demo apps — diagnostic logging to stdout is expected here
      - "**/example/**"
      - "**/examples/**"
      - "**/demo/**"
      - "**/demos/**"
      # Benchmark harnesses — verbose diagnostic output is intentional
      - "**/benchmark/**"
      - "**/benchmarks/**"
      - "**/bench/**"
      # Mocks and playgrounds — non-production scaffolding
      - "**/mocks/**"
      - "**/__mocks__/**"
      - "**/playground/**"
      - "**/sandbox/**"
      # Archived or deprecated code paths no longer shipped to production
      - "**/archive/**"
match:
  fact:
    kind: security.information-leakage
    bind: issue
emit:
  finding:
    category: security.privacy
    severity: medium
    confidence: 0.6
    tags:
      - security
      - privacy
      - logging
      - diagnostics
  message:
    title: Remove sensitive or diagnostic data from `${captures.issue.text}`
    summary: "`${captures.issue.text}` exposes sensitive fields or internal diagnostic detail through a direct sink."
  remediation:
    summary: Replace the payload with a fixed summary, redact sensitive fields, and strip stack, env, request, or cookie data from production output.

