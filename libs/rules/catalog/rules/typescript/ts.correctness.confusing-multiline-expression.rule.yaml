apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.confusing-multiline-expression
  version: v1
  title: Confusing multiline expression
  summary: Detects confusing multiline expression issues in JavaScript and TypeScript source.
  rationale: Confusing multiline expression patterns are a common source of bugs and confusing runtime behavior.
  aliases:
    - JS-0024
  tags:
    - correctness
    - language
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: language.confusing-multiline-expression
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: medium
    confidence: 0.85
    tags:
      - correctness
      - language
  message:
    title: Fix confusing multiline expression
    summary: "`${captures.issue.text}` matches ts.correctness.confusing-multiline-expression."
  remediation:
    summary: Refactor the code to remove the confusing multiline expression pattern.
