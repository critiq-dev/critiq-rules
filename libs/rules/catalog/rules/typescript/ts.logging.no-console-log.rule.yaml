apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.logging.no-console-log
  version: v1
  title: Avoid console logging methods
  summary: Use the project logger instead of console logging methods (log, warn, info, debug, trace).
  rationale: Console logging bypasses the shared logger pipeline and cannot be properly filtered, throttled, or redirected in production.
  tags:
    - logging
    - rules-catalog
scope:
  languages:
    - typescript
  paths:
    exclude:
      # Standard test exclusions
      - "**/test/**"
      - "**/tests/**"
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
match:
  node:
    kind: CallExpression
    bind: call
    where:
      - path: callee.object.text
        equals: console
      - path: callee.property.text
        in:
          - log
          - warn
          - info
          - debug
          - trace
emit:
  finding:
    category: maintainability
    severity: low
    confidence: high
    tags:
      - logging
  message:
    title: Avoid `${captures.call.text}`
    summary: Use the project logger instead of `${captures.call.text}`.
  remediation:
    summary: Replace `${captures.call.text}` with the logger.
