apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.restricted-global-variable
  version: v2
  title: Restricted global variable
  summary: Detects restricted global variable issues in JavaScript and TypeScript source.
  rationale: Restricted global variable patterns are a common source of bugs and confusing runtime behavior.
  aliases:
    - JS-0122
  tags:
    - correctness
    - language
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/__tests__/**"
      - "**/__mocks__/**"
      - "**/tests/**"
      - "**/test/**"
      - "**/e2e/**"
      - "**/*.d.ts"
match:
  fact:
    kind: language.restricted-global-variable
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: low
    confidence: 0.45
    tags:
      - correctness
      - language
  message:
    title: Variable name shadows a restricted browser global
    summary: "`${captures.issue.text}` matches a restricted global identifier (a property of the browser `window` object). This may cause unexpected behavior when the global is unintentionally referenced."
  remediation:
    summary: Declare the variable locally, rename it to avoid the collision, or use a qualified reference (e.g., `window.name`).
