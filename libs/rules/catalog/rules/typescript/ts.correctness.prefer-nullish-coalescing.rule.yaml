apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.prefer-nullish-coalescing
  title: Prefer nullish coalescing operator
  summary: Use the nullish coalescing operator `??` instead of `||` for null/undefined defaults.
  rationale: The `||` operator treats all falsy values (0, '', false) as absent. The `??` operator only treats null and undefined as absent, which is often the intended behavior.
  aliases:
    - JS-0365
  tags:
    - correctness
    - language
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: language.prefer-nullish-coalescing
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: medium
    confidence: 0.80
    tags:
      - correctness
      - language
  message:
    title: Use nullish coalescing operator `??`
    summary: "`${captures.issue.text}` uses `||` on a potentially nullish value."
  remediation:
    summary: Replace `||` with `??` when the intent is to default only for null or undefined, not other falsy values.
