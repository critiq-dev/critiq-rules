apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.testing.no-skipped-test-without-ticket
  version: v1
  title: Skipped tests should cite a ticket or timed suppression
  summary: Skipped or disabled tests should reference a tracked issue, expiry, or accepted suppression comment.
  rationale: Silent skips decay into permanent holes in coverage unless they carry reviewable intent.
  tags:
    - testing
    - quality
    - rules-catalog
  stability: experimental
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: testing.skipped-without-ticket-reference
    bind: issue
emit:
  finding:
    category: quality.testing
    severity: medium
    confidence: 0.72
    tags:
      - testing
      - coverage
  message:
    title: Skipped test lacks adequate justification — add a reason, ticket, or comment
    summary: "`${captures.issue.text}` skips a test without a descriptive name, explicit reason string, ticket reference, or explanatory comment."
  remediation:
    summary: Add a descriptive test name, explicit reason string, ticket reference, or explanatory comment to document why this test is skipped.
