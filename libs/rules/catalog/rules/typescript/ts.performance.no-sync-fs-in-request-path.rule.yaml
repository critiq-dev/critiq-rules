apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.performance.no-sync-fs-in-request-path
  version: v2
  title: Avoid sync filesystem calls in request paths
  summary: Calling fs.*Sync methods inside a request handler (e.g., readFileSync, existsSync) blocks the event loop and increases per-request latency under load.
  rationale: >
    Synchronous filesystem calls such as fs.readFileSync, fs.existsSync, and fs.writeFileSync halt the Node.js
    event loop until the operation completes. Inside a request handler this prevents the server from processing
    any other requests, causing cascading latency under concurrent load. Replace these calls with their
    promise-based equivalents from node:fs/promises (e.g., readFile, writeFile) or use streaming patterns
    for large files.
  tags:
    - performance
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: performance.no-sync-fs-in-request-path
    bind: issue
emit:
  finding:
    category: performance.io
    severity: high
    confidence: 0.8
    tags:
      - performance
  message:
    title: Avoid sync filesystem calls in request paths
    summary: "`${captures.issue.text}` matches ts.performance.no-sync-fs-in-request-path."
  remediation:
    summary: Replace sync filesystem calls with their async counterparts (e.g., readFile, writeFile from node:fs/promises) to avoid blocking the event loop on every request.
