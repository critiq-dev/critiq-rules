apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.testing.no-test-only-code-in-production
  version: v2
  title: Production modules importing test-only code
  summary: A production module imports a test-only module (spec, test, or mock file), introducing dead coupling to the test harness.
  rationale: Importing test doubles, mock directories, or spec files from production code creates hidden dependencies on test infrastructure. These imports may pull test utilities into production bundles or cause unexpected behavior when test harnesses are not present.
  tags:
    - testing
    - quality
    - rules-catalog
  stability: experimental
  appliesTo: project
scope:
  languages:
    - typescript
    - javascript
match:
  any:
    - fact:
        kind: testing.production-imports-test-code
        bind: issue
emit:
  finding:
    category: quality.testing
    severity: low
    confidence: 0.85
    tags:
      - testing
      - boundaries
  message:
    title: Remove test-only import in `${captures.issue.text}`
    summary: "`${captures.issue.text}` imports a test-only module (spec, test, or mock file). Move shared helpers into a neutral utility module to avoid coupling production code to the test harness."
  remediation:
    summary: Move shared test helper logic into neutral utility modules under a non-test path. Keep test-specific setup and mocks confined to test files and `__mocks__` directories.
