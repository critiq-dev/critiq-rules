apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.postmessage-wildcard-origin
  version: v2
  title: Avoid wildcard `postMessage` targets
  summary: A `postMessage` call uses `*` as the target origin, allowing any embedded or opener page to intercept the message regardless of its origin.
  rationale: When `postMessage` uses `*` as the target origin, any page that embeds the sender in a frame or opens it as a popup can receive the message. This allows malicious or compromised pages to intercept application data, authentication tokens, or sensitive user information. A specific expected origin should always be used to restrict message delivery to trusted recipients.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-79
      title: Cross-site Scripting (XSS)
    - kind: owasp
      title: Cross Site Scripting Prevention Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
  tags:
    - security
    - browser
    - messaging
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/__tests__/**"
      - "**/tests/**"
      - "**/test/**"
      - "**/*.generated.*"
      - "**/__generated__/**"
      - "**/vendor/**"
      - "**/node_modules/**"
match:
  fact:
    kind: security.postmessage-wildcard-origin
    bind: issue
emit:
  finding:
    category: security.browser
    severity: high
    confidence: 0.95
    tags:
      - security
      - browser
      - messaging
  message:
    title: Replace the wildcard target in `${captures.issue.text}`
    summary: "`${captures.issue.text}` uses `*` as the `postMessage` target origin."
  remediation:
    summary: Set the target origin to a strict expected origin instead of `*`.

