apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.react.no-direct-state-mutation
  version: v2
  title: Do not mutate React state directly
  summary: Direct assignment to `this.state` or its properties bypasses React change detection, leaving the UI out of sync with the underlying data.
  rationale: State mutations must flow through `setState` or hook updaters so React can schedule renders and enforce immutability guarantees. Assigning directly to `this.state` or its properties circumvents the component lifecycle, preventing React from detecting the change and re-rendering. This causes bugs where the UI silently diverges from the component's actual data state.
  aliases:
    - JS-0444
  tags:
    - react
    - ui
    - rules-catalog
  stability: experimental
  appliesTo: function
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: ui.react.direct-state-mutation
    bind: issue
emit:
  finding:
    category: correctness.ui
    severity: high
    confidence: 0.88
    tags:
      - react
      - ui
  message:
    title: Update React state with setState
    summary: "`${captures.issue.text}` mutates state directly."
  remediation:
    summary: Call setState with the next value or replace the state object immutably instead of assigning into this.state.
