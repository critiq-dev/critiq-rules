apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.react.no-direct-state-mutation
  version: v3
  title: Direct React state property mutation
  summary: Assigning to a `this.state` property bypasses React change detection, leaving the rendered UI out of sync with the component's data.
  rationale: React tracks state changes through `setState` and hook updaters so it can schedule re-renders. Assigning directly to a property of `this.state` updates the underlying data without notifying React, so the component keeps rendering stale values until an unrelated update happens to flush the change. This produces bugs where the UI silently diverges from the component's actual state. Initialize state immutably and route every subsequent change through `setState`.
  aliases:
    - JS-0444
  tags:
    - react
    - ui
    - rules-catalog
  stability: experimental
  appliesTo: function
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: ui.react.direct-state-mutation
    bind: issue
    # Only flag property mutations (`this.state.x = ...`). Whole-object
    # assignments (`this.state = {...}`) are the standard, correct way to
    # initialize state in a class constructor and were 100% false positives
    # across the corpus, so they are excluded here.
    where:
      - path: text
        matches: '^this\.state\.'
emit:
  finding:
    category: correctness.ui
    severity: medium
    confidence: 0.9
    tags:
      - react
      - ui
  message:
    title: Update state with setState
    summary: "`${captures.issue.text}` mutates a state property directly."
  remediation:
    summary: Call this.setState with the next value (or a hook updater) instead of assigning into this.state.
