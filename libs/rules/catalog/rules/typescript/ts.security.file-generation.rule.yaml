apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.file-generation
  version: v2
  title: File writes using request-derived destination paths
  summary: File write functions such as writeFileSync receive a destination path derived from request or upload input, allowing attackers to control where files are created on disk.
  rationale: |-
    When a file write operation uses a destination path derived from user input such as request body fields, query parameters, or uploaded file metadata, an attacker can control where content is written on disk.
    This enables path traversal out of intended directories, overwriting of configuration or system files, and creation of malicious files in sensitive locations.
    Always generate destination filenames on the server using trusted sources like crypto.randomUUID() or constrain writes to an allowlisted directory and filename set.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-434
      title: Unrestricted Upload of File with Dangerous Type
    - kind: owasp
      title: File Upload Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
  tags:
    - security
    - filesystem
    - file-write
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: security.file-generation
    bind: issue
emit:
  finding:
    category: security.filesystem
    severity: high
    confidence: 0.92
    tags:
      - security
      - filesystem
      - file-write
  message:
    title: Validate the local write path used by `${captures.issue.text}`
    summary: "`${captures.issue.text}` writes to a path derived from external input without a trusted local filename."
  remediation:
    summary: Generate the destination name on the server or constrain writes to an allowlisted directory and filename set.

