apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.insecure-auth-cookie-flags
  version: v1
  title: Harden auth-bearing cookies
  summary: Auth and session cookies should set HttpOnly, Secure, and SameSite.
  rationale: Cookie flags prevent browser scripts, mixed transport, and cross-site requests from exposing session-bearing values.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-614
      title: Sensitive Cookie Without Secure Attribute
    - kind: owasp
      title: Session Management Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
  tags:
    - security
    - authentication
    - cookies
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      - "**/test/**"
      - "**/tests/**"
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
match:
  fact:
    kind: ts.security.insecure-auth-cookie-flags
    bind: issue
emit:
  finding:
    category: security.authentication
    severity: medium
    confidence: 0.9
    tags:
      - security
      - authentication
      - cookies
  message:
    title: Auth cookie `${captures.issue.text}` missing security flags
    summary: "`${captures.issue.text}` sets a cookie with an auth-signaling name without HttpOnly, Secure, or SameSite protections. Missing these flags makes the cookie vulnerable to session theft via XSS, MITM, or CSRF."
  remediation:
    summary: "Add `HttpOnly`, `Secure`, and an explicit `SameSite` policy (preferably `Lax` or `Strict`) before the cookie is used for session or auth state. For example: `{ httpOnly: true, secure: true, sameSite: 'lax' }`."


