apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.compound-assignment-with-await
  title: Compound assignment with await
  summary: Detects compound assignment with await issues in JavaScript and TypeScript source.
  rationale: Compound assignment with await patterns are a common source of bugs and confusing runtime behavior.
  aliases:
    - JS-0040
  tags:
    - correctness
    - language
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: language.compound-assignment-with-await
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: high
    confidence: 0.85
    tags:
      - correctness
      - language
  message:
    title: Fix compound assignment with await
    summary: "`${captures.issue.text}` matches ts.correctness.compound-assignment-with-await."
  remediation:
    summary: Refactor the code to remove the compound assignment with await pattern.
