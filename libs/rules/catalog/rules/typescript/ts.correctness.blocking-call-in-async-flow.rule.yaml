apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.blocking-call-in-async-flow
  version: v2
  title: Blocking call inside async flow
  summary: Async functions should not call synchronous blocking APIs on the hot path.
  rationale: Blocking sync APIs stall the event loop and erase the throughput benefits of async control flow.
  tags:
    - performance
    - async
    - rules-catalog
    - crq-cor-013
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/__tests__/**"
      - "**/tests/**"
      - "**/test/**"
      - "**/*.integration.test.*"
      - "**/*.browser.test.*"
      - "**/*.e2e.test.*"
      - "**/*-cli.*"
      - "**/*.cli.*"
      - "**/*.config.*"
      - "**/seeds/**"
      - "**/migrations/**"
match:
  fact:
    kind: async.blocking-call-in-async-flow
    bind: issue
emit:
  finding:
    category: performance.async
    severity: medium
    confidence: 0.75
    tags:
      - performance
      - async
  message:
    title: Blocking sync call `${captures.issue.text}` inside async function
    summary: "`${captures.issue.text}` uses a blocking sync API inside an async function, stalling the event loop and defeating the throughput benefit of async control flow."
  remediation:
    summary: Replace the sync API with its async equivalent (await + promise-based API) or move the blocking work off the request path into a worker thread or CLI-only path.
