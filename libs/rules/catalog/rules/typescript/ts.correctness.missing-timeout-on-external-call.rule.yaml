apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.missing-timeout-on-external-call
  version: v2
  title: Missing timeout or retry on external call
  summary: Network calls without timeout, cancellation, or retry configuration may hang indefinitely.
  rationale: Without an explicit timeout, a network call can block indefinitely until the underlying TCP timeout fires, exhausting connection pools and blocking the event loop in single-threaded runtimes. In serverless environments this can consume billing time until the function hard-timeout is reached. Transient errors without retry logic can cascade into upstream failures under load.
  references:
    - kind: cwe
      id: CWE-16
      title: Configuration
    - kind: owasp
      title: Secure Configuration Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Secure_Configuration_Cheat_Sheet.html
  tags:
    - correctness
    - resilience
    - rules-catalog
    - crq-cor-014
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
  paths:
    include:
      - "**/*.{ts,tsx,js,jsx,mjs,cjs}"
    exclude:
      - "**/test/**"
      - "**/tests/**"
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/node_modules/**"
      - "**/vendor/**"
match:
  fact:
    kind: resilience.missing-timeout-on-external-call
    bind: issue
emit:
  finding:
    category: correctness.resilience
    severity: high
    confidence: 0.9
    tags:
      - correctness
      - resilience
  message:
    title: Configure timeouts and retry protection on external calls
    summary: "`${captures.issue.text}` performs an external call without explicit timeout, cancellation, or retry settings."
  remediation:
    summary: "Pass a timeout-bearing option such as `signal: AbortSignal.timeout(5000)` for `fetch` or `{ timeout: 5000 }` for axios. For Node.js, consider configuring a global dispatcher timeout via `undici.setGlobalDispatcher`. Wrap critical calls with a retry library like `p-retry` or `async-retry` using exponential backoff and jitter."
