apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.optional-value-without-fallback
  version: v2
  title: Optional value used without fallback
  summary: An expression uses a value that may be undefined without a guard or nullish coalescing fallback, risking NaN or unexpected stringification at runtime.
  rationale: Using maybe-undefined values in arithmetic, concatenation, or relational comparisons propagates uncertainty into the result. Arithmetic produces NaN, string concatenation yields "undefined" literals, and relational comparisons return false — each silently diverging from developer intent.
  tags:
    - correctness
    - "null"
    - rules-catalog
    - crq-cor-004
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/__tests__/**"
      - "**/test/**"
      - "**/tests/**"
      - "**/testdata/**"
      - "**/fixtures/**"
match:
  fact:
    kind: data-flow.optional-value-without-fallback
    bind: issue
emit:
  finding:
    category: correctness.null
    severity: low
    confidence: 0.55
    tags:
      - correctness
      - "null"
  message:
    title: Normalize optional values before using them
    summary: "`${captures.issue.text}` uses a maybe-missing value. Verify that a null guard or fallback is in place."
  remediation:
    summary: Add `??`, `||`, or an explicit guard so the expression always receives a defined value. This check operates per-expression and may not detect guards in sibling expressions.

