apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.runtime.no-process-exit
  version: v2
  title: Avoid `process.exit` in application code
  summary: Do not call `process.exit` from application logic; reserve termination for CLI entrypoints.
  rationale: Forced process termination bypasses graceful shutdown, in-flight request draining, and cleanup hooks.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-16
      title: Configuration
    - kind: owasp
      title: Secure Configuration Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Secure_Configuration_Cheat_Sheet.html
  aliases:
    - JS-0263
  tags:
    - runtime
    - node
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
  paths:
    exclude:
      - "**/scripts/**"
      - "**/cli/**"
      - "**/bin/**"
      - "**/db/migrations/**"
      - "**/db/seeds/**"
      - "**/prisma/migrations/**"
      - "**/fixtures/**"
      - "**/test/**"
      - "**/tests/**"
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/e2e/**"
      - "**/healthcheck*"
      - "**/setup-*"
      - "**/vendor/**"
      - "**/unpack-*"
match:
  fact:
    kind: runtime.process-exit
    bind: issue
emit:
  finding:
    category: security.reliability
    severity: medium
    confidence: 0.9
    tags:
      - runtime
      - node
  message:
    title: Avoid `process.exit` in application code
    summary: "`${captures.issue.text}` terminates the process abruptly. Reserve `process.exit` for CLI entrypoints and scripts. Scripts, CLI tools, test files, database migrations, and healthcheck utilities are excluded."
  remediation:
    summary: Propagate errors to the caller or use graceful shutdown hooks instead of calling `process.exit`.

