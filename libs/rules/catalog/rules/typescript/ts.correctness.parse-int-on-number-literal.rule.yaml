apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.parse-int-on-number-literal
  title: parseInt on a number literal
  summary: Found `parseInt()` or `Number.parseInt()` called on a number literal.
  rationale: Passing a number literal to parseInt is always unnecessary since the value is already an integer or can be converted with Math methods.
  aliases:
    - JS-0253
  tags:
    - correctness
    - language
    - rules-catalog
    - crq-cor-048
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: language.parse-int-on-number-literal
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: medium
    confidence: 1.0
    tags:
      - correctness
      - language
  message:
    title: parseInt on a number literal is unnecessary
    summary: "`${captures.issue.text}` calls parseInt on a number literal."
  remediation:
    summary: Remove the parseInt call; the value is already a number.
