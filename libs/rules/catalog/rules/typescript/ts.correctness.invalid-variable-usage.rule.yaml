apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.invalid-variable-usage
  title: Invalid variable usage
  summary: Detects invalid variable usage issues in JavaScript and TypeScript source.
  rationale: Invalid variable usage patterns are a common source of bugs and confusing runtime behavior.
  aliases:
    - JS-0043
  tags:
    - correctness
    - language
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: language.invalid-variable-usage
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: high
    confidence: 0.85
    tags:
      - correctness
      - language
  message:
    title: Fix invalid variable usage
    summary: "`${captures.issue.text}` matches ts.correctness.invalid-variable-usage."
  remediation:
    summary: Refactor the code to remove the invalid variable usage pattern.
