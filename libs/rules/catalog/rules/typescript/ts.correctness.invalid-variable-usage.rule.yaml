apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.correctness.invalid-variable-usage
  version: v2
  title: Invalid this or arguments usage
  summary: Referencing 'this' at the top-level or 'arguments' outside any function body causes a runtime ReferenceError in strict mode.
  rationale: In ES modules and strict mode, 'this' at module scope is undefined and 'arguments' is not defined, causing a runtime ReferenceError when accessed. Inside a function, 'arguments' is a deprecated special object that should be replaced with rest parameters ('...args') for clarity, type safety, and modern engine compatibility.
  aliases:
    - JS-0043
  tags:
    - correctness
    - language
    - rules-catalog
    - public-directory-parity
  stability: stable
  appliesTo: file
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: language.invalid-variable-usage
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: high
    confidence: 0.85
    tags:
      - correctness
      - language
  message:
    title: Fix invalid variable usage
    summary: "`${captures.issue.text}` matches ts.correctness.invalid-variable-usage."
  remediation:
    summary: Refactor the code to remove the invalid variable usage pattern.
