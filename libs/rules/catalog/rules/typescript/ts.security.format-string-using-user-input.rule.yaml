apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ts.security.format-string-using-user-input
  version: v2
  title: Avoid request-controlled format strings
  summary: Logging and formatting helpers should not take request input as the format string itself.
  rationale: Passing user-controlled data as the format string in printf-style helpers (console.log, util.format, etc.) allows format-specifier injection. An attacker can include format specifiers (%s, %d, %j, %o) in the input to manipulate log output or leak internal state from subsequent arguments. Structured logging objects (logger.info({...})) are excluded — they are passed as data, not format templates.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-20
      title: Improper Input Validation
    - kind: owasp
      title: Input Validation Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
  tags:
    - security
    - logging
    - input-validation
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
match:
  fact:
    kind: security.format-string-using-user-input
    bind: issue
emit:
  finding:
    category: security.input-validation
    severity: high
    confidence: 0.88
    tags:
      - security
      - logging
      - input-validation
  message:
    title: Treat `${captures.issue.text}` as data, not a format string
    summary: "`${captures.issue.text}` uses request-controlled input as the formatting template."
  remediation:
    summary: Keep the format string fixed and pass request data as ordinary arguments or structured fields.

