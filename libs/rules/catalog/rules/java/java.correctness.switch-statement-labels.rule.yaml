apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: java.correctness.switch-statement-labels
  title: Switch blocks must not contain statement labels
  summary: Statement labels inside switch blocks are confusing and likely unintended.
  rationale: Traditional Java switch blocks allow arbitrary statement labels, but they are error-prone and easily confused with case labels. Switch expressions and modern switch blocks do not permit them.
  detection:
    kind: pattern
  aliases:
    - JAVA-E1005
  tags:
    - correctness
    - java
    - rules-catalog
  stability: experimental
  appliesTo: block
scope:
  languages:
    - java
  paths:
    include:
      - "**/*.java"
    exclude:
      - "**/src/test/**"
      - "**/tests/**"
      - "**/*Test.java"
match:
  fact:
    kind: java.correctness.switch-statement-labels
    bind: issue
emit:
  finding:
    category: correctness.control-flow
    severity: critical
    confidence: 0.85
    tags:
      - correctness
      - java
  message:
    title: Statement label inside switch block
    summary: "`${captures.issue.text}` is a statement label inside a switch block. Only case and default labels are expected."
  remediation:
    summary: Remove the statement label or restructure the switch block to avoid non-case labels.
