apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: java.correctness.possible-null-access
  version: v2
  title: Avoid possible null access on collection or map lookups
  summary: Chaining a method call on a `.get()`, `.poll()`, `.peek()`, or `.element()` result may throw a NullPointerException.
  rationale: Collection, map, and queue lookups can return null for missing keys or empty queues; dereferencing the result without a null check will throw a NullPointerException at runtime. This is a heuristic text-based detector that cannot see enclosing null guards or domain-specific non-null guarantees.
  aliases:
    - JAVA-E1083
  tags:
    - correctness
    - java
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - java
  paths:
    include:
      - "**/*.java"
    exclude:
      - "**/src/test/**"
      - "**/tests/**"
      - "**/*Test.java"
      - "**/src/testFixtures/**"
match:
  fact:
    kind: java.correctness.possible-null-access
    bind: issue
emit:
  finding:
    category: correctness.null-safety
    severity: medium
    confidence: 0.45
    tags:
      - correctness
      - java
  message:
    title: Possible null access from `${captures.issue.text}`
    summary: "The result of a `.get()`, `.poll()`, `.peek()`, or `.element()` call is dereferenced without a null check, which may throw a NullPointerException."
  remediation:
    summary: Assign the result to a local variable, check for null, and handle the absent case before dereferencing.
