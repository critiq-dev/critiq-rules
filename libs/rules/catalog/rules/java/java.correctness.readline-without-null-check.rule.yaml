apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: java.correctness.readline-without-null-check
  version: v2
  title: readLine() result used without null check
  summary: The result of `readLine()` is assigned to a variable but used before a null check, or directly dereferenced without storing.
  rationale: "BufferedReader.readLine() and Console.readLine() return null when the end of the stream is reached. Calling methods or accessing fields on a null return value throws a NullPointerException. This includes both cases where the result is stored in a variable and used without verification, and cases where the result is directly dereferenced (e.g. `reader.readLine().trim()`)."
  detection:
    kind: pattern
  aliases:
    - JAVA-E0220
  tags:
    - correctness
    - java
    - null-safety
    - rules-catalog
  stability: experimental
  appliesTo: block
scope:
  languages:
    - java
  paths:
    include:
      - "**/*.java"
    exclude:
      - "**/src/test/**"
      - "**/tests/**"
      - "**/*Test.java"
match:
  fact:
    kind: java.correctness.readline-without-null-check
    bind: issue
emit:
  finding:
    category: correctness.null-safety
    severity: high
    confidence: 0.85
    tags:
      - correctness
      - java
  message:
    title: readLine() result used without null check
    summary: The result of `readLine()` may be null — dereferencing it without a check will cause a NullPointerException.
  remediation:
    summary: Add a null check before using the result, e.g. `String s = r.readLine(); if (s != null) { s.trim(); }`
