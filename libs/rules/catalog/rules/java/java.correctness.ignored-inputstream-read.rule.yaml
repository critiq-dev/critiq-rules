apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: java.correctness.ignored-inputstream-read
  version: v2
  title: Return value of InputStream.read() ignored
  summary: Calling `read()` on an InputStream without using the return value discards data.
  rationale: "InputStream.read() returns the number of bytes read, which may be less than the buffer size. Ignoring this value can lead to data loss, incorrectly formed output, or infinite loops when the return value is the only termination signal. Because the detector uses text-based heuristics without type resolution, it may match `.read()` calls on non-InputStream objects; a conservative filter excludes matches where the return value is passed as a function argument, used in a comparison, or consumed in an expression."
  detection:
    kind: pattern
  aliases:
    - JAVA-E0183
  tags:
    - correctness
    - java
    - resource
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - java
  paths:
    include:
      - "**/*.java"
    exclude:
      - "**/tests/**"
      - "**/*Test.java"
match:
  fact:
    kind: java.correctness.ignored-inputstream-read
    bind: issue
emit:
  finding:
    category: correctness.resource
    severity: medium
    confidence: 0.65
    tags:
      - correctness
      - java
  message:
    title: InputStream.read() return value ignored
    summary: The return value of `read()` is not captured or checked. The actual number of bytes read may differ from the buffer size.
  remediation:
    summary: Capture and check the return value of `read()`, for example `int n = is.read(buf);`
