apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: java.correctness.equals-null-check
  version: v2
  title: equals method without null check
  summary: "An `equals(Object)` implementation dereferences the parameter (e.g., `o.getClass()` or `o.toString()`) without a preceding null guard, causing a NullPointerException when the argument is null."
  rationale: "The `equals` contract requires accepting null and returning false. Dereferencing the parameter before checking for null — such as calling `o.getClass()` inside `if (getClass() != o.getClass())` — throws a NullPointerException instead. An identity check like `if (this == o) return true;` is not a null guard: `this == null` is always false, so execution falls through to the dereference. Use `if (o == null) return false;`, an `instanceof` check (which returns false for null), or `Objects.equals()` for field-level comparisons."
  detection:
    kind: pattern
  aliases:
    - JAVA-E0110
  tags:
    - correctness
    - java
    - null-safety
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - java
  paths:
    include:
      - "**/*.java"
    exclude:
      - "**/tests/**"
      - "**/*Test.java"
match:
  fact:
    kind: java.correctness.equals-null-check
    bind: issue
emit:
  finding:
    category: correctness.null-safety
    severity: high
    confidence: 0.90
    tags:
      - correctness
      - java
  message:
    title: equals() without null check
    summary: "`${captures.issue.text}` does not guard against null before accessing members. Add a null check."
  remediation:
    summary: "Add `if (o == null) return false;` at the start of equals, use an `instanceof` check, or use `Objects.equals()` for field comparisons."
