apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: java.correctness.stringbuilder-char-ctor
  version: v1
  title: StringBuilder or StringBuffer constructed with a char literal
  summary: StringBuilder/StringBuffer constructed with a single char argument behaves as a capacity argument, not a string value.
  rationale: In Java, StringBuilder(char) calls StringBuilder(int) via char-to-int widening, creating a builder with capacity equal to the char's numeric value instead of containing the character.
  tags:
    - correctness
    - java
    - rules-catalog
  stability: stable
  appliesTo: block
  aliases:
    - JAVA-E1023
scope:
  languages:
    - java
  paths:
    include:
      - "**/*.java"
    exclude:
      - "**/src/test/**"
      - "**/tests/**"
      - "**/*Test.java"
match:
  fact:
    kind: java.correctness.stringbuilder-char-ctor
    bind: issue
emit:
  finding:
    category: correctness.types
    severity: critical
    confidence: 0.95
    tags:
      - correctness
      - java
  message:
    title: StringBuilder/StringBuffer constructed with char literal
    summary: A char literal argument to StringBuilder/StringBuffer is widened to int and used as a capacity. Use a String literal instead.
  remediation:
    summary: Replace the char literal with a String literal, e.g. `new StringBuilder("a")` instead of `new StringBuilder('a')`.
