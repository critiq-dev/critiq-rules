apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: java.correctness.timezone-invalid-id
  version: v2
  title: "Hardcoded timezone ID in TimeZone.getTimeZone()"
  summary: "`TimeZone.getTimeZone()` called with a hardcoded string silently falls back to GMT for unrecognized timezone IDs instead of throwing an exception."
  rationale: "Unlike `ZoneId.of()` which throws `ZoneRulesException` for invalid identifiers, `TimeZone.getTimeZone()` silently returns the GMT timezone when passed an unrecognized ID. A typo or incorrect timezone string therefore goes undetected at compile time and at runtime, causing subtle time-related bugs that can persist unnoticed in production."
  aliases:
    - JAVA-E1093
  tags:
    - correctness
    - java
    - rules-catalog
  stability: experimental
  appliesTo: block
scope:
  languages:
    - java
  paths:
    include:
      - "**/*.java"
    exclude:
      - "**/src/test/**"
      - "**/tests/**"
      - "**/*Test.java"
match:
  fact:
    kind: java.correctness.timezone-invalid-id
    bind: issue
emit:
  finding:
    category: correctness.api-misuse
    severity: high
    confidence: 0.40
    tags:
      - correctness
      - java
  message:
    title: "TimeZone.getTimeZone() is called with a hardcoded string in `${captures.issue.text}`"
    summary: "Unrecognized timezone IDs silently return GMT. Verify the ID is valid or use `ZoneId.of()` which throws on invalid input."
  remediation:
    summary: "Verify the timezone ID is valid using `TimeZone.getAvailableIDs()`, or migrate to `ZoneId.of()` which throws `ZoneRulesException` for invalid identifiers and uses the IANA timezone database."
