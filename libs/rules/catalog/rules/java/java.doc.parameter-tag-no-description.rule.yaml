apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: java.doc.parameter-tag-no-description
  version: v2
  title: Javadoc @param or @throws tag has no description
  summary: "@param and @throws tags must include a description."
  rationale: "A Javadoc @param or @throws tag without a description adds no value to the documentation. Either describe the parameter or the exception, or remove the tag entirely."
  detection:
    kind: pattern
  aliases:
    - JAVA-D1005
  tags:
    - documentation
    - java
    - javadoc
    - rules-catalog
  stability: experimental
  appliesTo: block
scope:
  languages:
    - java
  paths:
    include:
      - "**/*.java"
match:
  fact:
    kind: java.doc.parameter-tag-no-description
    bind: issue
emit:
  finding:
    category: documentation.javadoc
    severity: low
    confidence: 0.85
    tags:
      - documentation
      - java
  message:
    title: "Javadoc tag is missing a description"
    summary: "The `${captures.issue.text}` tag has no description."
  remediation:
    summary: "Add a description explaining the purpose of the parameter or the conditions under which the exception is thrown."
