apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: php.correctness.invalid-static-method
  version: v1
  title: Static call to instance method
  summary: "Calling self::method() or static::method() when the method is not declared as static will produce a deprecation notice in PHP 8.2+ and an error in future versions."
  aliases:
    - PHP-E1003
  rationale: "PHP deprecates static calls to non-static methods as of PHP 8.2. Single-file heuristic checks the enclosing class body for the method declaration and verifies it has the static keyword. Classes extending other classes are skipped."
  detection:
    kind: pattern
  tags:
    - correctness
    - php
    - rules-catalog
  stability: experimental
  appliesTo: block
scope:
  languages:
    - php
  paths:
    include:
      - "**/*.php"
match:
  fact:
    kind: php.correctness.invalid-static-method
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: critical
    confidence: 0.65
    tags:
      - correctness
      - php
  message:
    title: Static call to instance method ${captures.issue.text}
    summary: "Method ${captures.issue.text}() is called via self:: or static:: but is not declared as static in the enclosing class."
  remediation:
    summary: Add the static keyword to the method declaration or use $this->method() for instance calls.
