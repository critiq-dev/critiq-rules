    category: correctness.language
    severity: critical
    confidence: 0.9
    tags:
      - correctness
      - php
  message:
    title: Throw expressions require PHP 8.0+
    summary: "`${captures.issue.text}` matches php.correctness.throw-as-expression."
  remediation:
    summary: Throw expressions require PHP 8.0+
