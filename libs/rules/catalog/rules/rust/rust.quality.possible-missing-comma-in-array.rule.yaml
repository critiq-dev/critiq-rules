apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: rust.quality.possible-missing-comma-in-array
  title: "Check for possibly missing comma in array expression"
  summary: "Two adjacent expressions in an array literal without a comma separator likely indicate a missing comma."
  rationale: >-
    In Rust, `[1, 2 3]` is valid syntax (nested indexing) but a missing comma between
    elements is a common mistake that changes semantics. Flagging adjacent literal
    expressions inside brackets helps catch this.
  tags:
    - correctness
    - rust
    - rules-catalog
  stability: experimental
  appliesTo: block
  aliases:
    - RS-W1121
scope:
  languages:
    - rust
  paths:
    include:
      - "**/*.rs"
    exclude:
      - "**/tests/**"
      - "**/test/**"
      - "**/testdata/**"
      - "**/examples/**"
      - "**/benches/**"
      - "**/*_test.rs"
      - "**/*.spec.rs"
match:
  fact:
    kind: rust.quality.possible-missing-comma-in-array
    bind: issue
emit:
  finding:
    category: correctness.bug-risk
    severity: medium
    confidence: 0.75
    tags:
      - correctness
      - rust
  message:
    title: "Possible missing comma in `${captures.issue.text}`"
    summary: "`${captures.issue.text}` contains two adjacent expressions without a comma separator — a comma may be missing."
  remediation:
    summary: "Add a comma between adjacent array elements or verify the expression is correct."
