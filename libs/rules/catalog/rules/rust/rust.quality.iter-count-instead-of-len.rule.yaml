apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: rust.quality.iter-count-instead-of-len
  title: "Use `.len()` instead of `.iter().count()`"
  summary: "`.iter().count()` is unnecessarily expensive compared to `.len()`."
  rationale: >-
    Calling `.iter().count()` on a Vec, HashMap, or other collection
    iterates through all elements to count them. Use `.len()` for O(1)
    length access on collections that implement it.
  tags:
    - performance
    - rust
    - rules-catalog
  stability: experimental
  appliesTo: block
scope:
  languages:
    - rust
  paths:
    include:
      - "**/*.rs"
    exclude:
      - "**/tests/**"
      - "**/test/**"
      - "**/testdata/**"
      - "**/examples/**"
      - "**/benches/**"
      - "**/*_test.rs"
      - "**/*.spec.rs"
match:
  fact:
    kind: rust.quality.iter-count-instead-of-len
    bind: issue
emit:
  finding:
    category: performance
    severity: medium
    confidence: 0.85
    tags:
      - performance
      - rust
  message:
    title: "Use `.len()` instead of `${captures.issue.text}`"
    summary: "`${captures.issue.text}` iterates the entire collection to count elements. Use `.len()` for O(1) length access."
  remediation:
    summary: "Replace `.iter().count()` with `.len()` for collections that implement it (Vec, VecDeque, HashMap, HashSet, etc.)."
