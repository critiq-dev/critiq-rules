apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: rust.quality.env-string-literal
  title: "Suspicious string literal in `env!()` or `option_env!()`"
  summary: "The argument to `env!` does not resemble an environment variable name."
  rationale: >-
    `env!()` and `option_env!()` expect an environment variable name in
    UPPER_CASE convention. A value that does not match this pattern (e.g.,
    a lowercase string or a string with special characters) is likely a
    mistake and will fail at compile time or return `None` unexpectedly.
  tags:
    - correctness
    - rust
    - rules-catalog
  stability: experimental
  appliesTo: block
  aliases:
    - RS-W1015
scope:
  languages:
    - rust
  paths:
    include:
      - "**/*.rs"
    exclude:
      - "**/tests/**"
      - "**/test/**"
      - "**/testdata/**"
      - "**/examples/**"
      - "**/benches/**"
      - "**/*_test.rs"
      - "**/*.spec.rs"
match:
  fact:
    kind: rust.quality.env-string-literal
    bind: issue
emit:
  finding:
    category: correctness.bug-risk
    severity: medium
    confidence: 0.8
    tags:
      - correctness
      - rust
  message:
    title: "Suspicious env var name in `${captures.issue.text}`"
    summary: "`${captures.issue.text}` contains a value that does not look like an environment variable name. Use UPPER_CASE convention for env var names."
  remediation:
    summary: "Replace the argument with a valid environment variable name in UPPER_CASE, or switch to a regular string constant if you intended a literal value."
