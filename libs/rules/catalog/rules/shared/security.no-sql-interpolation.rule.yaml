apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: security.no-sql-interpolation
  version: v1
  title: SQL query text should not be dynamically interpolated
  summary: Database queries built with string interpolation risk SQL injection when values come from user input. Use parameterized queries instead.
  aliases:
    - PHP-A1002
  rationale: Raw or interpolated SQL can let attackers control query structure when values are not passed separately.
  detection:
    kind: pattern
  references:
    - kind: cwe
      id: CWE-89
      title: SQL Injection
    - kind: owasp
      title: SQL Injection Prevention Cheat Sheet
      url: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
  tags:
    - security
    - sql
    - injection
    - rules-catalog
  stability: stable
  appliesTo: block
scope:
  languages:
    - typescript
    - javascript
    - go
    - python
    - java
    - php
    - ruby
    - rust
match:
  fact:
    kind: security.sql-interpolation
    bind: queryCall
emit:
  finding:
    category: security.injection
    severity: medium
    confidence: 0.95
    tags:
      - security
      - sql
      - injection
  message:
    title: Dynamic SQL query text in `${captures.queryCall.text}`
    summary: "`${captures.queryCall.text}` builds a SQL query using string interpolation. If any interpolated value comes from user input, an attacker can control the query structure."
  remediation:
    summary: |
      Use prepared statements with placeholder parameters instead of string interpolation.

      ```typescript
      // Unsafe — interpolated user input
      connection.execute("SELECT * FROM users WHERE email = '" + userInput + "'")

      // Safe — parameterized query
      connection.execute("SELECT * FROM users WHERE email = ?", [userInput])
      ```

      Most database drivers and ORMs support parameterized queries. For dynamic query construction (schema names, column names), use the database driver's identifier quoting API (e.g., `quote_table_name()`).

