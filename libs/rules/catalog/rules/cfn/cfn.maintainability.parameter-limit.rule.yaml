apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.maintainability.parameter-limit
  version: v1
  title: Parameter limit
  summary: Parameter limit
  rationale: cfn-lint reports I2010 when Parameter limit.
  aliases:
    - CFLIN-I2010
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - i2010
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: I2010
emit:
  finding:
    category: maintainability.configuration
    severity: low
    confidence: 0.8
    tags:
      - cfn
      - cloudformation
  message:
    title: Parameter limit
    summary: "${captures.finding.text} matches cfn-lint I2010."
  remediation:
    summary: Resolve the cfn-lint I2010 finding in this CloudFormation template.
