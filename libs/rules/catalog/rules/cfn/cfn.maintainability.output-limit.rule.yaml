apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.maintainability.output-limit
  title: Output limit
  summary: Output limit
  rationale: cfn-lint reports I6010 when Output limit.
  aliases:
    - CFLIN-I6010
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - i6010
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: I6010
emit:
  finding:
    category: maintainability.configuration
    severity: low
    confidence: 0.8
    tags:
      - cfn
      - cloudformation
  message:
    title: Output limit
    summary: "${captures.finding.text} matches cfn-lint I6010."
  remediation:
    summary: Resolve the cfn-lint I6010 finding in this CloudFormation template.
