apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.sub-is-required-if-a-variable-is-used-in-a-string
  title: Sub is required if a variable is used in a string
  summary: Sub is required if a variable is used in a string
  rationale: cfn-lint reports E1029 when Sub is required if a variable is used in a string.
  aliases:
    - CFLIN-E1029
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e1029
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E1029
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Sub is required if a variable is used in a string
    summary: "${captures.finding.text} matches cfn-lint E1029."
  remediation:
    summary: Resolve the cfn-lint E1029 finding in this CloudFormation template.
