apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.snapstart-supports-the-configured-runtime
  version: v1
  title: Snapstart supports the configured runtime
  summary: Snapstart supports the configured runtime
  rationale: cfn-lint reports E2530 when Snapstart supports the configured runtime.
  aliases:
    - CFLIN-E2530
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e2530
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E2530
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Snapstart supports the configured runtime
    summary: "${captures.finding.text} matches cfn-lint E2530."
  remediation:
    summary: Resolve the cfn-lint E2530 finding in this CloudFormation template.
