apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.outputs-have-values-of-strings
  version: v1
  title: Outputs have values of strings
  summary: Outputs have values of strings
  rationale: cfn-lint reports E6003 when Outputs have values of strings.
  aliases:
    - CFLIN-E6003
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e6003
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E6003
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Outputs have values of strings
    summary: "${captures.finding.text} matches cfn-lint E6003."
  remediation:
    summary: Resolve the cfn-lint E6003 finding in this CloudFormation template.
