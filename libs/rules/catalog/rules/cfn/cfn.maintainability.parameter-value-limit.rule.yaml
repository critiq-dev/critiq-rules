apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.maintainability.parameter-value-limit
  version: v1
  title: Parameter value limit
  summary: Parameter value limit
  rationale: cfn-lint reports I2012 when Parameter value limit.
  aliases:
    - CFLIN-I2012
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - i2012
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: I2012
emit:
  finding:
    category: maintainability.configuration
    severity: low
    confidence: 0.8
    tags:
      - cfn
      - cloudformation
  message:
    title: Parameter value limit
    summary: "${captures.finding.text} matches cfn-lint I2012."
  remediation:
    summary: Resolve the cfn-lint I2012 finding in this CloudFormation template.
