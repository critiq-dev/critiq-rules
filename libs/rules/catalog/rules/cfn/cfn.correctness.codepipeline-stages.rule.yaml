apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.codepipeline-stages
  version: v1
  title: Codepipeline stages
  summary: Codepipeline stages
  rationale: cfn-lint reports E2540 when Codepipeline stages.
  aliases:
    - CFLIN-E2540
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e2540
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E2540
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Codepipeline stages
    summary: "${captures.finding.text} matches cfn-lint E2540."
  remediation:
    summary: Resolve the cfn-lint E2540 finding in this CloudFormation template.
