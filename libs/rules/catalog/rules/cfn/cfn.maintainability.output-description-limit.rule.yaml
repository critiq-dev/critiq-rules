apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.maintainability.output-description-limit
  version: v1
  title: Output description limit
  summary: Output description limit
  rationale: cfn-lint reports I6012 when Output description limit.
  aliases:
    - CFLIN-I6012
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - i6012
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: I6012
emit:
  finding:
    category: maintainability.configuration
    severity: low
    confidence: 0.8
    tags:
      - cfn
      - cloudformation
  message:
    title: Output description limit
    summary: "${captures.finding.text} matches cfn-lint I6012."
  remediation:
    summary: Resolve the cfn-lint I6012 finding in this CloudFormation template.
