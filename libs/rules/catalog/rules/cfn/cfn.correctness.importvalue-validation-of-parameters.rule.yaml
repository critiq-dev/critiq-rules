apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.importvalue-validation-of-parameters
  version: v1
  title: Importvalue validation of parameters
  summary: Importvalue validation of parameters
  rationale: cfn-lint reports E1016 when Importvalue validation of parameters.
  aliases:
    - CFLIN-E1016
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e1016
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E1016
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Importvalue validation of parameters
    summary: "${captures.finding.text} matches cfn-lint E1016."
  remediation:
    summary: Resolve the cfn-lint E1016 finding in this CloudFormation template.
