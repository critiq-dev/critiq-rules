apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.maintainability.output-name-limit
  title: Output name limit
  summary: Output name limit
  rationale: cfn-lint reports I6011 when Output name limit.
  aliases:
    - CFLIN-I6011
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - i6011
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: I6011
emit:
  finding:
    category: maintainability.configuration
    severity: low
    confidence: 0.8
    tags:
      - cfn
      - cloudformation
  message:
    title: Output name limit
    summary: "${captures.finding.text} matches cfn-lint I6011."
  remediation:
    summary: Resolve the cfn-lint I6011 finding in this CloudFormation template.
