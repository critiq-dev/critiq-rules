apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.template-description-limit
  title: Template description limit
  summary: Template description limit
  rationale: cfn-lint reports E1003 when Template description limit.
  aliases:
    - CFLIN-E1003
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e1003
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E1003
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Template description limit
    summary: "${captures.finding.text} matches cfn-lint E1003."
  remediation:
    summary: Resolve the cfn-lint E1003 finding in this CloudFormation template.
