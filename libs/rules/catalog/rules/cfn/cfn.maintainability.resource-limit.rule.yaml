apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.maintainability.resource-limit
  version: v1
  title: Resource limit
  summary: Resource limit
  rationale: cfn-lint reports I3010 when Resource limit.
  aliases:
    - CFLIN-I3010
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - i3010
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: I3010
emit:
  finding:
    category: maintainability.configuration
    severity: low
    confidence: 0.8
    tags:
      - cfn
      - cloudformation
  message:
    title: Resource limit
    summary: "${captures.finding.text} matches cfn-lint I3010."
  remediation:
    summary: Resolve the cfn-lint I3010 finding in this CloudFormation template.
