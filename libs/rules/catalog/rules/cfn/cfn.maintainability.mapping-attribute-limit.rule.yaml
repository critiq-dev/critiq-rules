apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.maintainability.mapping-attribute-limit
  title: Mapping attribute limit
  summary: Mapping attribute limit
  rationale: cfn-lint reports I7012 when Mapping attribute limit.
  aliases:
    - CFLIN-I7012
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - i7012
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: I7012
emit:
  finding:
    category: maintainability.configuration
    severity: low
    confidence: 0.8
    tags:
      - cfn
      - cloudformation
  message:
    title: Mapping attribute limit
    summary: "${captures.finding.text} matches cfn-lint I7012."
  remediation:
    summary: Resolve the cfn-lint I7012 finding in this CloudFormation template.
