apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.metadata-interface-have-appropriate-properties
  title: Metadata interface have appropriate properties
  summary: Metadata interface have appropriate properties
  rationale: cfn-lint reports E4001 when Metadata interface have appropriate properties.
  aliases:
    - CFLIN-E4001
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e4001
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E4001
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Metadata interface have appropriate properties
    summary: "${captures.finding.text} matches cfn-lint E4001."
  remediation:
    summary: Resolve the cfn-lint E4001 finding in this CloudFormation template.
