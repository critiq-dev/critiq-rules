apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.maintainability.mapping-name-limit
  title: Mapping name limit
  summary: Mapping name limit
  rationale: cfn-lint reports I7011 when Mapping name limit.
  aliases:
    - CFLIN-I7011
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - i7011
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: I7011
emit:
  finding:
    category: maintainability.configuration
    severity: low
    confidence: 0.8
    tags:
      - cfn
      - cloudformation
  message:
    title: Mapping name limit
    summary: "${captures.finding.text} matches cfn-lint I7011."
  remediation:
    summary: Resolve the cfn-lint I7011 finding in this CloudFormation template.
