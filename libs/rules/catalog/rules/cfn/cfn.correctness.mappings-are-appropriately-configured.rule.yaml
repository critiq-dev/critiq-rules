apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.mappings-are-appropriately-configured
  title: Mappings are appropriately configured
  summary: Mappings are appropriately configured
  rationale: cfn-lint reports E7001 when Mappings are appropriately configured.
  aliases:
    - CFLIN-E7001
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e7001
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E7001
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Mappings are appropriately configured
    summary: "${captures.finding.text} matches cfn-lint E7001."
  remediation:
    summary: Resolve the cfn-lint E7001 finding in this CloudFormation template.
