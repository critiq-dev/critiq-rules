apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.template-description-can-only-be-a-string
  title: Template description can only be a string
  summary: Template description can only be a string
  rationale: cfn-lint reports E1004 when Template description can only be a string.
  aliases:
    - CFLIN-E1004
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e1004
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E1004
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Template description can only be a string
    summary: "${captures.finding.text} matches cfn-lint E1004."
  remediation:
    summary: Resolve the cfn-lint E1004 finding in this CloudFormation template.
