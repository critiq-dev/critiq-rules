apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.sub-validation-of-parameters
  title: Sub validation of parameters
  summary: Sub validation of parameters
  rationale: cfn-lint reports E1019 when Sub validation of parameters.
  aliases:
    - CFLIN-E1019
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e1019
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E1019
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Sub validation of parameters
    summary: "${captures.finding.text} matches cfn-lint E1019."
  remediation:
    summary: Resolve the cfn-lint E1019 finding in this CloudFormation template.
