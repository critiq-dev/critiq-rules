apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.check-values-of-properties-for-valid-refs-and-getatts
  version: v1
  title: Check values of properties for valid refs and getatts
  summary: Check values of properties for valid refs and getatts
  rationale: cfn-lint reports E3008 when Check values of properties for valid refs and getatts.
  aliases:
    - CFLIN-E3008
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e3008
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E3008
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Check values of properties for valid refs and getatts
    summary: "${captures.finding.text} matches cfn-lint E3008."
  remediation:
    summary: Resolve the cfn-lint E3008 finding in this CloudFormation template.
