apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.cloudfront-aliases
  title: Cloudfront aliases
  summary: Cloudfront aliases
  rationale: cfn-lint reports E3013 when Cloudfront aliases.
  aliases:
    - CFLIN-E3013
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e3013
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E3013
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Cloudfront aliases
    summary: "${captures.finding.text} matches cfn-lint E3013."
  remediation:
    summary: Resolve the cfn-lint E3013 finding in this CloudFormation template.
