apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.maintainability.checks-for-legacy-instance-type-generations
  version: v1
  title: Checks for legacy instance type generations
  summary: Checks for legacy instance type generations
  rationale: cfn-lint reports I3100 when Checks for legacy instance type generations.
  aliases:
    - CFLIN-I3100
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - i3100
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: I3100
emit:
  finding:
    category: maintainability.configuration
    severity: low
    confidence: 0.8
    tags:
      - cfn
      - cloudformation
  message:
    title: Checks for legacy instance type generations
    summary: "${captures.finding.text} matches cfn-lint I3100."
  remediation:
    summary: Resolve the cfn-lint I3100 finding in this CloudFormation template.
