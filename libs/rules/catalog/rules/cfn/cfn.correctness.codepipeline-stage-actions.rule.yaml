apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.codepipeline-stage-actions
  title: Codepipeline stage actions
  summary: Codepipeline stage actions
  rationale: cfn-lint reports E2541 when Codepipeline stage actions.
  aliases:
    - CFLIN-E2541
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e2541
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E2541
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Codepipeline stage actions
    summary: "${captures.finding.text} matches cfn-lint E2541."
  remediation:
    summary: Resolve the cfn-lint E2541 finding in this CloudFormation template.
