apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.findinmap-validation-of-configuration
  title: Findinmap validation of configuration
  summary: Findinmap validation of configuration
  rationale: cfn-lint reports E1011 when Findinmap validation of configuration.
  aliases:
    - CFLIN-E1011
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e1011
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E1011
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Findinmap validation of configuration
    summary: "${captures.finding.text} matches cfn-lint E1011."
  remediation:
    summary: Resolve the cfn-lint E1011 finding in this CloudFormation template.
