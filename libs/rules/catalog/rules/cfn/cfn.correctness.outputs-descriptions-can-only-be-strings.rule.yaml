apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.outputs-descriptions-can-only-be-strings
  title: Outputs descriptions can only be strings
  summary: Outputs descriptions can only be strings
  rationale: cfn-lint reports E6005 when Outputs descriptions can only be strings.
  aliases:
    - CFLIN-E6005
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e6005
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E6005
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Outputs descriptions can only be strings
    summary: "${captures.finding.text} matches cfn-lint E6005."
  remediation:
    summary: Resolve the cfn-lint E6005 finding in this CloudFormation template.
