apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.check-properties-that-need-only-one-of-a-list-of-properties
  version: v1
  title: Check properties that need only one of a list of properties
  summary: Check properties that need only one of a list of properties
  rationale: cfn-lint reports E2523 when Check properties that need only one of a list of properties.
  aliases:
    - CFLIN-E2523
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e2523
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E2523
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Check properties that need only one of a list of properties
    summary: "${captures.finding.text} matches cfn-lint E2523."
  remediation:
    summary: Resolve the cfn-lint E2523 finding in this CloudFormation template.
