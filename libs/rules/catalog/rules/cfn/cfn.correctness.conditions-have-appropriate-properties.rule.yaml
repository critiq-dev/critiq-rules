apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.conditions-have-appropriate-properties
  version: v1
  title: Conditions have appropriate properties
  summary: Conditions have appropriate properties
  rationale: cfn-lint reports E8001 when Conditions have appropriate properties.
  aliases:
    - CFLIN-E8001
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e8001
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E8001
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Conditions have appropriate properties
    summary: "${captures.finding.text} matches cfn-lint E8001."
  remediation:
    summary: Resolve the cfn-lint E8001 finding in this CloudFormation template.
