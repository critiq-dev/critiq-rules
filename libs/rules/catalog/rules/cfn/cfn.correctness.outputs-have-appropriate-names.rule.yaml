apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.outputs-have-appropriate-names
  version: v1
  title: Outputs have appropriate names
  summary: Outputs have appropriate names
  rationale: cfn-lint reports E6004 when Outputs have appropriate names.
  aliases:
    - CFLIN-E6004
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e6004
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E6004
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Outputs have appropriate names
    summary: "${captures.finding.text} matches cfn-lint E6004."
  remediation:
    summary: Resolve the cfn-lint E6004 finding in this CloudFormation template.
