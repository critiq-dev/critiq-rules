apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.resource-properties-are-invalid
  version: v1
  title: Resource properties are invalid
  summary: Resource properties are invalid
  rationale: cfn-lint reports E3002 when Resource properties are invalid.
  aliases:
    - CFLIN-E3002
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e3002
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E3002
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Resource properties are invalid
    summary: "${captures.finding.text} matches cfn-lint E3002."
  remediation:
    summary: Resolve the cfn-lint E3002 finding in this CloudFormation template.
