apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.mappings-have-appropriate-names
  title: Mappings have appropriate names
  summary: Mappings have appropriate names
  rationale: cfn-lint reports E7002 when Mappings have appropriate names.
  aliases:
    - CFLIN-E7002
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e7002
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E7002
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Mappings have appropriate names
    summary: "${captures.finding.text} matches cfn-lint E7002."
  remediation:
    summary: Resolve the cfn-lint E7002 finding in this CloudFormation template.
