apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.cidr-validation-of-parameters
  version: v1
  title: Cidr validation of parameters
  summary: Cidr validation of parameters
  rationale: cfn-lint reports E1024 when Cidr validation of parameters.
  aliases:
    - CFLIN-E1024
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e1024
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E1024
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Cidr validation of parameters
    summary: "${captures.finding.text} matches cfn-lint E1024."
  remediation:
    summary: Resolve the cfn-lint E1024 finding in this CloudFormation template.
