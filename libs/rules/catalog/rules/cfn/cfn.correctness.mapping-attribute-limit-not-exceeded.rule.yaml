apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.mapping-attribute-limit-not-exceeded
  title: Mapping attribute limit not exceeded
  summary: Mapping attribute limit not exceeded
  rationale: cfn-lint reports E7012 when Mapping attribute limit not exceeded.
  aliases:
    - CFLIN-E7012
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e7012
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E7012
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Mapping attribute limit not exceeded
    summary: "${captures.finding.text} matches cfn-lint E7012."
  remediation:
    summary: Resolve the cfn-lint E7012 finding in this CloudFormation template.
