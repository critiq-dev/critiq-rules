apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.default-value-is-within-parameter-constraints
  version: v1
  title: Default value is within parameter constraints
  summary: Default value is within parameter constraints
  rationale: cfn-lint reports E2015 when Default value is within parameter constraints.
  aliases:
    - CFLIN-E2015
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e2015
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E2015
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Default value is within parameter constraints
    summary: "${captures.finding.text} matches cfn-lint E2015."
  remediation:
    summary: Resolve the cfn-lint E2015 finding in this CloudFormation template.
