apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: cfn.correctness.outputs-have-required-properties
  title: Outputs have required properties
  summary: Outputs have required properties
  rationale: cfn-lint reports E6002 when Outputs have required properties.
  aliases:
    - CFLIN-E6002
  tags:
    - cfn
    - cfn-lint
    - cloudformation
    - e6002
    - rules-catalog
  stability: stable
  appliesTo: file
  detection:
    kind: pattern
scope:
  languages:
    - all
  paths:
    include:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
    exclude:
      - "**/node_modules/**"
match:
  fact:
    kind: cfn.lint.finding
    bind: finding
    where:
      - path: ruleId
        equals: E6002
emit:
  finding:
    category: correctness.configuration
    severity: high
    confidence: 0.9
    tags:
      - cfn
      - cloudformation
  message:
    title: Outputs have required properties
    summary: "${captures.finding.text} matches cfn-lint E6002."
  remediation:
    summary: Resolve the cfn-lint E6002 finding in this CloudFormation template.
