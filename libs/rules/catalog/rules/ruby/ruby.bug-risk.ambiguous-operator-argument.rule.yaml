apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ruby.bug-risk.ambiguous-operator-argument
  version: v1
  title: Ambiguous operators in first arg of method invocation
  summary: >-
    The first argument to a method call starts with a unary operator, which
    can be ambiguous. For example, `foo +bar` could be parsed as `foo(+bar)`
    or `foo() + bar` by readers.
  rationale: >-
    Unary operators in method arguments without parentheses create readability
    ambiguity. Adding parentheses clarifies developer intent.
  detection:
    kind: pattern
  tags:
    - rules-catalog
    - ruby
  stability: stable
  appliesTo: block
scope:
  languages:
    - ruby
  paths:
    include:
      - "**/*.rb"
    exclude:
      - "**/vendor/**"
      - "**/node_modules/**"
match:
  fact:
    kind: ruby.bug-risk.ambiguous-operator-argument
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: high
    confidence: 0.8
    tags:
      - ruby
  message:
    title: Review `${captures.issue.text}`
    summary: >-
      "`${captures.issue.text}` matches
      `ruby.bug-risk.ambiguous-operator-argument`."
  remediation:
    summary: >-
      Wrap the argument in parentheses to disambiguate, e.g.
      `method(+arg)` instead of `method +arg`.
