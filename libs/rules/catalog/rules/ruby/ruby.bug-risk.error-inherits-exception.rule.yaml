apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ruby.bug-risk.error-inherits-exception
  version: v1
  title: Avoid custom errors that inherit from Exception
  summary: >-
    Errors should inherit from StandardError so routine rescue handlers behave predictably.
  rationale: >-
    Errors should inherit from StandardError so routine rescue handlers behave predictably.
  detection:
    kind: pattern
  tags:
    - rules-catalog
    - ruby
  stability: stable
  appliesTo: block
scope:
  languages:
    - ruby
  paths:
    include:
      - "**/*.rb"
    exclude:
      - "**/vendor/**"
      - "**/node_modules/**"
match:
  fact:
    kind: ruby.bug-risk.error-inherits-exception
    bind: issue
emit:
  finding:
    category: correctness.exceptions
    severity: high
    confidence: 0.9
    tags:
      - ruby
  message:
    title: Review `${captures.issue.text}`
    summary: "`${captures.issue.text}` matches `ruby.bug-risk.error-inherits-exception`."
  remediation:
    summary: >-
      Errors should inherit from StandardError so routine rescue handlers behave predictably.
