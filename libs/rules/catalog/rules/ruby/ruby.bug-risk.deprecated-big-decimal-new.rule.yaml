apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ruby.bug-risk.deprecated-big-decimal-new
  title: Avoid deprecated BigDecimal.new
  summary: >-
    BigDecimal.new is deprecated since BigDecimal 1.3.3 and removed in 2.0.0.
    Use BigDecimal() instead.
  rationale: >-
    BigDecimal.new has been removed in recent versions of the BigDecimal gem.
  detection:
    kind: pattern
  tags:
    - rules-catalog
    - ruby
  stability: stable
  appliesTo: block
scope:
  languages:
    - ruby
  paths:
    include:
      - "**/*.rb"
    exclude:
      - "**/vendor/**"
      - "**/node_modules/**"
match:
  fact:
    kind: ruby.bug-risk.deprecated-big-decimal-new
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: high
    confidence: 0.95
    tags:
      - ruby
  message:
    title: Review `${captures.issue.text}`
    summary: "`${captures.issue.text}` matches `ruby.bug-risk.deprecated-big-decimal-new`."
  remediation:
    summary: >-
      Replace BigDecimal.new with BigDecimal() to avoid deprecation warnings
      and compatibility issues with BigDecimal 2.0+.
