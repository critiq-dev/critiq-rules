apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ruby.bug-risk.with-index-value-unused
  title: with_index called but index value unused
  summary: >-
    `with_index` or `each_with_index` is called but the block only receives
    one argument. The index value is silently discarded.
  rationale: >-
    When `with_index` is used with a single-argument block, the index value
    is computed but never used. Either use both arguments or omit the index
    entirely to make the intent clear.
  detection:
    kind: pattern
  tags:
    - rules-catalog
    - ruby
  stability: stable
  appliesTo: block
scope:
  languages:
    - ruby
  paths:
    include:
      - "**/*.rb"
    exclude:
      - "**/vendor/**"
      - "**/node_modules/**"
match:
  fact:
    kind: ruby.bug-risk.with-index-value-unused
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: high
    confidence: 0.85
    tags:
      - ruby
  message:
    title: Review `${captures.issue.text}`
    summary: >-
      "`${captures.issue.text}` matches
      `ruby.bug-risk.with-index-value-unused`."
  remediation:
    summary: >-
      Add a second block parameter to capture the index, or remove the
      `with_index` call if the index is not needed.
