apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ruby.bug-risk.when-branch-without-body
  title: Avoid when branches without a body
  summary: >-
    A when clause has no body expression. Add the intended behavior or remove
    the branch.
  rationale: >-
    A when clause without a body is dead code. The developer likely forgot to
    implement the branch or intended to use a different control flow.
  detection:
    kind: pattern
  tags:
    - rules-catalog
    - ruby
  stability: stable
  appliesTo: function
scope:
  languages:
    - ruby
  paths:
    include:
      - "**/*.rb"
    exclude:
      - "**/vendor/**"
      - "**/node_modules/**"
match:
  fact:
    kind: ruby.bug-risk.when-branch-without-body
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: high
    confidence: 0.9
    tags:
      - ruby
  message:
    title: Review `${captures.issue.text}`
    summary: >-
      "`${captures.issue.text}` matches
      `ruby.bug-risk.when-branch-without-body`."
  remediation:
    summary: >-
      Add a body expression to the when clause or remove it if the branch is
      not needed.
