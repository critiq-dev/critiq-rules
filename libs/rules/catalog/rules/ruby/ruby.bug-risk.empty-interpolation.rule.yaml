apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ruby.bug-risk.empty-interpolation
  version: v1
  title: Avoid empty string interpolation #{}
  summary: >-
    String interpolation with nothing inside the braces #{} produces nothing and
    is always a mistake.
  rationale: >-
    An empty interpolation #{} in a string literal contributes nothing to the
    string and is always a placeholder that was never filled in.
  detection:
    kind: pattern
  aliases:
    - RB-LI1018
  tags:
    - rules-catalog
    - ruby
  stability: stable
  appliesTo: block
scope:
  languages:
    - ruby
  paths:
    include:
      - "**/*.rb"
    exclude:
      - "**/vendor/**"
      - "**/node_modules/**"
match:
  fact:
    kind: ruby.bug-risk.empty-interpolation
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: high
    confidence: 0.95
    tags:
      - ruby
  message:
    title: Review `${captures.issue.text}`
    summary: >-
      "`${captures.issue.text}` matches
      `ruby.bug-risk.empty-interpolation`."
  remediation:
    summary: >-
      Remove the empty interpolation or add the intended expression inside the
      braces.
