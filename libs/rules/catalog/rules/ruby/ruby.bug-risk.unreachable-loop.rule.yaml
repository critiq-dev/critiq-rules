apiVersion: critiq.dev/v1alpha1
kind: Rule
metadata:
  id: ruby.bug-risk.unreachable-loop
  title: Avoid unconditional exit as first statement in loop
  summary: >-
    A loop body starts with an unconditional return, break, or raise. This
    causes the loop to execute at most once and the remaining loop body is
    unreachable.
  rationale: >-
    An unconditional exit statement (return, break, raise, throw, exit, abort,
    or fail) as the first statement in a loop body means the loop will never
    iterate more than once, making the loop structure misleading.
  detection:
    kind: pattern
  aliases:
    - RB-LI1090
  tags:
    - rules-catalog
    - ruby
  stability: experimental
  appliesTo: function
scope:
  languages:
    - ruby
  paths:
    include:
      - "**/*.rb"
    exclude:
      - "**/vendor/**"
      - "**/node_modules/**"
match:
  fact:
    kind: ruby.bug-risk.unreachable-loop
    bind: issue
emit:
  finding:
    category: correctness.language
    severity: high
    confidence: 0.7
    tags:
      - ruby
  message:
    title: Review `${captures.issue.text}`
    summary: >-
      "`${captures.issue.text}` matches
      `ruby.bug-risk.unreachable-loop`."
  remediation:
    summary: >-
      Move the exit statement to after the loop body, or add a condition to
      make it conditional.
