apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/ruby/ruby.bug-risk.plain-method-instead-of-proc.rule.yaml
fixtures:
  - name: "flags bare method(:foo) in enumerable context"
    sourcePath: ./fixtures/ruby.bug-risk.plain-method-instead-of-proc/invalid.rb
    expect:
      findingCount: 1
      allRuleIds:
        - ruby.bug-risk.plain-method-instead-of-proc
  - name: "accepts &method(:foo) syntax"
    sourcePath: ./fixtures/ruby.bug-risk.plain-method-instead-of-proc/valid.rb
    expect:
      findingCount: 0
      allRuleIds: []
