apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/ruby/ruby.bug-risk.when-branch-without-body.rule.yaml
fixtures:
  - name: flags when branches without body
    sourcePath: ./fixtures/ruby.bug-risk.when-branch-without-body/invalid.rb
    expect:
      findingCount: 2
