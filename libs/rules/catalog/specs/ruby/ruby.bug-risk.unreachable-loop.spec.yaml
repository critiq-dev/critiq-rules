apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/ruby/ruby.bug-risk.unreachable-loop.rule.yaml
fixtures:
  - name: flags unconditional exit in loop
    sourcePath: ./fixtures/ruby.bug-risk.unreachable-loop/invalid.rb
    expect:
      findingCount: 2
      allRuleIds:
        - ruby.bug-risk.unreachable-loop
        - ruby.bug-risk.unreachable-loop
