apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/go/go.security.tls-missing-min-version.rule.yaml
fixtures:
  - name: flags tls.Config literal without MinVersion
    sourcePath: ./fixtures/go.security.tls-missing-min-version/invalid.go
