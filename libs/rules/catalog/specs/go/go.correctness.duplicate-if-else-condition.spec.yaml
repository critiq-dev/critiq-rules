apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/go/go.correctness.duplicate-if-else-condition.rule.yaml
fixtures:
  - name: flags duplicate if/else condition
    sourcePath: ./fixtures/go.correctness.duplicate-if-else-condition/invalid.go
