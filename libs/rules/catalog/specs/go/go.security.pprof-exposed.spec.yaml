apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/go/go.security.pprof-exposed.rule.yaml
fixtures:
  - name: flags blank pprof import and handler registration
    sourcePath: ./fixtures/go.security.pprof-exposed/invalid.go
    expect:
      findingCount: 2
