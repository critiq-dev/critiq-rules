apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/go/go.bug-risk.poorly-formed-nilness-guards.rule.yaml
fixtures:
  - name: flags poorly formed nilness guard with == nil &&
    sourcePath: ./fixtures/go.bug-risk.poorly-formed-nilness-guards/invalid.go
    expect:
      findingCount: 1
      allRuleIds:
        - go.bug-risk.poorly-formed-nilness-guards
  - name: accepts correct nilness guard with != nil &&
    sourcePath: ./fixtures/go.bug-risk.poorly-formed-nilness-guards/valid.go
    expect:
      findingCount: 0
      allRuleIds: []
