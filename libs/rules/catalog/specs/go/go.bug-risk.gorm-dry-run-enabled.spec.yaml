apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/go/go.bug-risk.gorm-dry-run-enabled.rule.yaml
fixtures:
  - name: flags DryRun set to true
    sourcePath: ./fixtures/go.bug-risk.gorm-dry-run-enabled/invalid.go
    expect:
      findingCount: 1
      allRuleIds:
        - go.bug-risk.gorm-dry-run-enabled
  - name: accepts DryRun set to false
    sourcePath: ./fixtures/go.bug-risk.gorm-dry-run-enabled/valid.go
    expect:
      findingCount: 0
      allRuleIds: []
