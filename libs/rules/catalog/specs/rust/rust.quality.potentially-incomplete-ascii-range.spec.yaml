apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/rust/rust.quality.potentially-incomplete-ascii-range.rule.yaml
fixtures:
  - name: flags exclusive ASCII range
    sourcePath: ./fixtures/rust.quality.potentially-incomplete-ascii-range/invalid.rs
    expect:
      findingCount: 1
      allRuleIds:
        - rust.quality.potentially-incomplete-ascii-range
