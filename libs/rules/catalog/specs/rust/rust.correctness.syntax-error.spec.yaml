apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/rust/rust.correctness.syntax-error.rule.yaml
fixtures:
  - name: flags syntax-error
    sourcePath: ./fixtures/rust.correctness.syntax-error/invalid.rs
    expect:
      findingCount: 1
      allRuleIds:
        - rust.correctness.syntax-error
  - name: accepts safe alternative for syntax-error
    sourcePath: ./fixtures/rust.correctness.syntax-error/valid.rs
    expect:
      findingCount: 0
      allRuleIds: []
