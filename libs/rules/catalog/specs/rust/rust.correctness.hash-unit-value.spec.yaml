apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/rust/rust.correctness.hash-unit-value.rule.yaml
fixtures:
  - name: flags hashing a unit value
    sourcePath: ./fixtures/rust.correctness.hash-unit-value/invalid.rs
    expect:
      findingCount: 1
      allRuleIds:
        - rust.correctness.hash-unit-value
  - name: accepts hashing a non-unit value
    sourcePath: ./fixtures/rust.correctness.hash-unit-value/valid.rs
    expect:
      findingCount: 0
      allRuleIds: []
