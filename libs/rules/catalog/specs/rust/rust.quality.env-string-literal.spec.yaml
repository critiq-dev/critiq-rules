apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/rust/rust.quality.env-string-literal.rule.yaml
fixtures:
  - name: flags suspicious string in env!
    sourcePath: ./fixtures/rust.quality.env-string-literal/invalid.rs
    expect:
      findingCount: 1
      allRuleIds:
        - rust.quality.env-string-literal
  - name: accepts uppercase env var name
    sourcePath: ./fixtures/rust.quality.env-string-literal/valid.rs
    expect:
      findingCount: 0
      allRuleIds: []
