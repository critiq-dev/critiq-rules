apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/rust/rust.security.invisible-unicode.rule.yaml
fixtures:
  - name: flags invisible unicode characters
    sourcePath: ./fixtures/rust.security.invisible-unicode/invalid.rs
    expect:
      findingCount: 1
      allRuleIds:
        - rust.security.invisible-unicode
  - name: accepts clean source
    sourcePath: ./fixtures/rust.security.invisible-unicode/valid.rs
    expect:
      findingCount: 0
      allRuleIds: []
