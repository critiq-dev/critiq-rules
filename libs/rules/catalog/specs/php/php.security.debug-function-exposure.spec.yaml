apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/php/php.security.debug-function-exposure.rule.yaml
fixtures:
  - name: flags debug dump in app code
    sourcePath: ./fixtures/php.security.debug-function-exposure/invalid.php
    expect:
      findingCount: 1
      allRuleIds:
        - php.security.debug-function-exposure
  - name: ignores production code without debug dumps
    sourcePath: ./fixtures/php.security.debug-function-exposure/valid.php
    expect:
      findingCount: 0
      allRuleIds: []
