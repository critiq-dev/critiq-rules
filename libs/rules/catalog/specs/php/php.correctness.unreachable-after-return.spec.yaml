apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/php/php.correctness.unreachable-after-return.rule.yaml
fixtures:
  - name: flags unreachable statements after return
    sourcePath: ./fixtures/php.correctness.unreachable-after-return/invalid.php
