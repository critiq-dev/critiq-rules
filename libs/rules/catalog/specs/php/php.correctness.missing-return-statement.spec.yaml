apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/php/php.correctness.missing-return-statement.rule.yaml
fixtures:
  - name: flags function with return type but no return statement
    sourcePath: ./fixtures/php.correctness.missing-return-statement/invalid.php
    expect:
      findingCount: 1
      allRuleIds:
        - php.correctness.missing-return-statement
  - name: ignores function with return type and return statement
    sourcePath: ./fixtures/php.correctness.missing-return-statement/valid.php
    expect:
      findingCount: 0
      allRuleIds: []
