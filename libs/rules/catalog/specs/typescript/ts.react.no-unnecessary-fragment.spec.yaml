apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/typescript/ts.react.no-unnecessary-fragment.rule.yaml
fixtures:
  - name: flags unnecessary fragment wrapping a single child
    sourcePath: ./fixtures/ts.react.no-unnecessary-fragment/invalid.tsx
    expect:
      findingCount: 1
      allRuleIds:
        - ts.react.no-unnecessary-fragment
      allSeverities:
        - low
