apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/typescript/ts.performance.sequential-async-calls.rule.yaml
fixtures:
  - name: flags independent awaits that serialize work
    sourcePath: ./fixtures/ts.performance.sequential-async-calls/invalid.ts
    expect:
      findingCount: 1
      allRuleIds:
        - ts.performance.sequential-async-calls
      allSeverities:
        - low
  - name: ignores parallelized async work
    sourcePath: ./fixtures/ts.performance.sequential-async-calls/valid.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: ignores sequential awaits in test file paths (path exclusion)
    sourcePath: ./fixtures/ts.performance.sequential-async-calls/__tests__/good.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: ignores sequential awaits in scripts directory (path exclusion)
    sourcePath: ./fixtures/ts.performance.sequential-async-calls/scripts/build-script.ts
    expect:
      findingCount: 0
      allRuleIds: []
