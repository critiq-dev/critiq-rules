apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/typescript/ts.testing.no-skipped-test-without-ticket.rule.yaml
fixtures:
  - name: flags bare skip
    sourcePath: ./fixtures/ts.testing.no-skipped-test-without-ticket/invalid.test.ts
    expect:
      findingCount: 1
      allRuleIds:
        - ts.testing.no-skipped-test-without-ticket
  - name: allows ticket in comment
    sourcePath: ./fixtures/ts.testing.no-skipped-test-without-ticket/valid.test.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: allows xit with descriptive name
    sourcePath: ./fixtures/ts.testing.no-skipped-test-without-ticket/valid.xit-with-name.test.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: allows conditional skip with reason string
    sourcePath: ./fixtures/ts.testing.no-skipped-test-without-ticket/valid.conditional-skip-with-reason.test.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: allows skip with meaningful reason
    sourcePath: ./fixtures/ts.testing.no-skipped-test-without-ticket/valid.skip-with-meaningful-reason.test.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: allows skip with preceding comment
    sourcePath: ./fixtures/ts.testing.no-skipped-test-without-ticket/valid.skip-with-comment.test.ts
    expect:
      findingCount: 0
      allRuleIds: []
