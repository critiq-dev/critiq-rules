apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/typescript/ts.security.insecure-auth-cookie-flags.rule.yaml
fixtures:
  - name: flags auth cookie with missing protections
    sourcePath: ./fixtures/ts.security.insecure-auth-cookie-flags/invalid.ts
    expect:
      findingCount: 1
      allRuleIds:
        - ts.security.insecure-auth-cookie-flags
      allSeverities:
        - medium
  - name: ignores non-auth cookie with complete protections
    sourcePath: ./fixtures/ts.security.insecure-auth-cookie-flags/valid.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: ignores generic serialize call (CSS parser pattern)
    sourcePath: ./fixtures/ts.security.insecure-auth-cookie-flags/good-serialize.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: ignores non-auth cookie with variable name containing 'cookie'
    sourcePath: ./fixtures/ts.security.insecure-auth-cookie-flags/good-non-auth-cookie.ts
    expect:
      findingCount: 0
      allRuleIds: []

