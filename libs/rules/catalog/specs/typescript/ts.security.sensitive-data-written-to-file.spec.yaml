apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/typescript/ts.security.sensitive-data-written-to-file.rule.yaml
fixtures:
  - name: flags sensitive data written to files
    sourcePath: ./fixtures/public-security/auth-files.invalid.ts
    expect:
      findingCount: 1
      allRuleIds:
        - ts.security.sensitive-data-written-to-file
      allSeverities:
        - medium
  - name: ignores nonsensitive file exports
    sourcePath: ./fixtures/public-security/auth-files.valid.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: ignores build script file writes
    sourcePath: ./fixtures/public-security/auth-files.build-script.ts
    expect:
      findingCount: 0
      allRuleIds: []


