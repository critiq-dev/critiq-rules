apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/typescript/ts.quality.no-mixed-abstraction-level.rule.yaml
fixtures:
  - name: flags mixed abstraction in one function
    sourcePath: ./fixtures/ts.quality.no-mixed-abstraction-level/invalid.ts
