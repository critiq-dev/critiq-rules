apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/typescript/ts.security.open-redirect.rule.yaml
fixtures:
  - name: flags request-controlled redirect targets
    sourcePath: ./fixtures/ts.security.open-redirect/invalid.ts
    expect:
      findingCount: 1
      allRuleIds:
        - ts.security.open-redirect
      allSeverities:
        - high
  - name: ignores redirects after internal normalization
    sourcePath: ./fixtures/ts.security.open-redirect/valid.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: ignores shared safe redirect helpers
    sourcePath: ./fixtures/ts.security.open-redirect/shared-safe-wrapper.valid.ts
    expect:
      findingCount: 0
      allRuleIds: []
  - name: flags Java servlet redirects driven by request parameters
    sourcePath: ./fixtures/ts.security.open-redirect/invalid.java
    expect:
      findingCount: 1
      allRuleIds:
        - ts.security.open-redirect
      allSeverities:
        - high
  - name: ignores fixed-path servlet redirects
    sourcePath: ./fixtures/ts.security.open-redirect/valid.java
    expect:
      findingCount: 0
      allRuleIds: []
  - name: flags Go redirects driven by request query parameters
    sourcePath: ./fixtures/ts.security.open-redirect/invalid.go
    expect:
      findingCount: 1
      allRuleIds:
        - ts.security.open-redirect
      allSeverities:
        - high
  - name: flags Python redirects driven by request query parameters
    sourcePath: ./fixtures/ts.security.open-redirect/invalid.py
    expect:
      findingCount: 1
      allRuleIds:
        - ts.security.open-redirect
      allSeverities:
        - high
  - name: ignores fixed-path Python redirects
    sourcePath: ./fixtures/ts.security.open-redirect/valid.py
    expect:
      findingCount: 0
      allRuleIds: []
