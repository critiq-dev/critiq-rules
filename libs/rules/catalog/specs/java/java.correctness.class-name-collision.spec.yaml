apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/java/java.correctness.class-name-collision.rule.yaml
fixtures:
  - name: flags class whose name matches its explicit superclass
    sourcePath: ./fixtures/java.correctness.class-name-collision/invalid.java
    expect:
      findingCount: 1
      allRuleIds:
        - java.correctness.class-name-collision
  - name: allows class whose name differs from superclass
    sourcePath: ./fixtures/java.correctness.class-name-collision/valid.java
    expect:
      findingCount: 0
      allRuleIds: []
