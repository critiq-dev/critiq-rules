apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/python/py.security.sensitive-logging.rule.yaml
fixtures:
  - name: flags sensitive data in log statement
    sourcePath: ./fixtures/py.security.sensitive-logging/invalid.py
