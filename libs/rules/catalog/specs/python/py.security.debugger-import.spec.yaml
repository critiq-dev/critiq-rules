apiVersion: critiq.dev/v1alpha1
kind: RuleSpec
rulePath: ../../rules/python/py.security.debugger-import.rule.yaml
fixtures:
  - name: flags debugger imports in source
    sourcePath: ./fixtures/py.security.debugger-import/debugger_import.invalid.py
